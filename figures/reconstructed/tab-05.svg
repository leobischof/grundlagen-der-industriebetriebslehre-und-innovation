<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1312 1003" width="1312" height="1003" data-figure-id="tab-05" data-status="faithful" font-family="Arial, Helvetica, sans-serif">
  <title>Unterschiede zwischen SME und IDE Entrepreneurship</title>
  <rect x="0" y="0" width="1312" height="1003" fill="#ffffff"/>
  <!-- Table without vertical rules: faint header band, a grey rule under the header, faint row separators -->
  <rect x="18" y="20" width="1172" height="72" fill="#f4f4f4"/>
  <path d="M18 92 H1190" fill="none" stroke="#a6a6a6" stroke-width="3"/>
  <path d="M18 195 H1190 M18 400 H1190 M18 640 H1190 M18 750 H1190" fill="none" stroke="#dddddd" stroke-width="2"/>
  <!-- Header (given, not part of the answer) -->
  <text font-family="Arial, Helvetica, sans-serif" x="33" y="58" font-size="31" font-weight="bold">SME Entrepreneurship</text>
  <text font-family="Arial, Helvetica, sans-serif" x="625" y="58" font-size="31" font-weight="bold">IDE Entrepreneurship</text>
  <text font-family="Arial, Helvetica, sans-serif" class="answer" x="33" y="124" font-size="31">Fokus auf das Bedienen von lokalen und</text>
  <text font-family="Arial, Helvetica, sans-serif" class="answer" x="33" y="170" font-size="31">regionalen Märkten</text>
  <text font-family="Arial, Helvetica, sans-serif" class="answer" x="625" y="124" font-size="31">Fokus auf globale und / oder regionale</text>
  <text font-family="Arial, Helvetica, sans-serif" class="answer" x="625" y="170" font-size="31">Märkte</text>
  <text font-family="Arial, Helvetica, sans-serif" class="answer" x="33" y="234" font-size="31">Für eine Etablierung am Markt und</text>
  <text font-family="Arial, Helvetica, sans-serif" class="answer" x="33" y="280" font-size="31">Wachstum ist Innovation nicht notwen-</text>
  <text font-family="Arial, Helvetica, sans-serif" class="answer" x="33" y="326" font-size="31">dig. Auch Wettbewerbsvorteile sind keine</text>
  <text font-family="Arial, Helvetica, sans-serif" class="answer" x="33" y="372" font-size="31">Voraussetzung.</text>
  <text font-family="Arial, Helvetica, sans-serif" class="answer" x="625" y="234" font-size="31">Das Unternehmen baut auf Formen der</text>
  <text font-family="Arial, Helvetica, sans-serif" class="answer" x="625" y="280" font-size="31">Innovation (Technik, Geschäftsmodell,</text>
  <text font-family="Arial, Helvetica, sans-serif" class="answer" x="625" y="326" font-size="31">Modell) und potentiellen Wettbewerbs-</text>
  <text font-family="Arial, Helvetica, sans-serif" class="answer" x="625" y="372" font-size="31">vorteilen auf.</text>
  <text font-family="Arial, Helvetica, sans-serif" class="answer" x="33" y="436" font-size="31">&gt;&gt;Non-tradeable-Jobs&lt;&lt; Arbeitsplätze</text>
  <text font-family="Arial, Helvetica, sans-serif" class="answer" x="33" y="482" font-size="31">die vor Ort bestehen (beispielsweise in</text>
  <text font-family="Arial, Helvetica, sans-serif" class="answer" x="33" y="528" font-size="31">der Dienstleistungsbranche – Restau-</text>
  <text font-family="Arial, Helvetica, sans-serif" class="answer" x="33" y="574" font-size="31">rants, Gesundheitswesen, Einzelhandel,</text>
  <text font-family="Arial, Helvetica, sans-serif" class="answer" x="33" y="620" font-size="31">Bauwesen etc.)</text>
  <text font-family="Arial, Helvetica, sans-serif" class="answer" x="625" y="436" font-size="31">&gt;&gt;Tradeable-Jobs&lt;&lt; Arbeitsplätze kön-</text>
  <text font-family="Arial, Helvetica, sans-serif" class="answer" x="625" y="482" font-size="31">nen von Personen außerhalb eines Lan-</text>
  <text font-family="Arial, Helvetica, sans-serif" class="answer" x="625" y="528" font-size="31">des ausgeübt werden – beispielsweise</text>
  <text font-family="Arial, Helvetica, sans-serif" class="answer" x="625" y="574" font-size="31">Produktion, Beratung, Ingenieurwesen.</text>
  <text font-family="Arial, Helvetica, sans-serif" class="answer" x="33" y="682" font-size="31">Geringes externes Kapital – meist Fami-</text>
  <text font-family="Arial, Helvetica, sans-serif" class="answer" x="33" y="728" font-size="31">lienbetriebe</text>
  <text font-family="Arial, Helvetica, sans-serif" class="answer" x="625" y="682" font-size="31">Breit aufgestellte Eigentümergruppe, ein-</text>
  <text font-family="Arial, Helvetica, sans-serif" class="answer" x="625" y="728" font-size="31">schließlich vieler externer Kapitalgeber</text>
  <text font-family="Arial, Helvetica, sans-serif" class="answer" x="33" y="791" font-size="31">Unternehmenswachstum linear – je mehr</text>
  <text font-family="Arial, Helvetica, sans-serif" class="answer" x="33" y="837" font-size="31">selbst in die Firma investiert wird, desto</text>
  <text font-family="Arial, Helvetica, sans-serif" class="answer" x="33" y="883" font-size="31">positiver und zügiger reagiert das Sys-</text>
  <text font-family="Arial, Helvetica, sans-serif" class="answer" x="33" y="929" font-size="31">tem (Ertrag, Cashflow. Arbeitsplätze,</text>
  <text font-family="Arial, Helvetica, sans-serif" class="answer" x="33" y="975" font-size="31">etc.) - siehe Abbildung 20</text>
  <text font-family="Arial, Helvetica, sans-serif" class="answer" x="625" y="791" font-size="31">Zunächst verliert das Unternehmen Kapi-</text>
  <text font-family="Arial, Helvetica, sans-serif" class="answer" x="625" y="837" font-size="31">tal, ist sie jedoch erfolgreich, wächst sie</text>
  <text font-family="Arial, Helvetica, sans-serif" class="answer" x="625" y="883" font-size="31">exponentiell. Das System reagiert zu-</text>
  <text font-family="Arial, Helvetica, sans-serif" class="answer" x="625" y="929" font-size="31">nächst träge auf Investitionen. - siehe</text>
  <text font-family="Arial, Helvetica, sans-serif" class="answer" x="625" y="975" font-size="31">Abbildung 20</text>
  <!-- Footnote mark 89 of the original (superscript after "Abbildung 20") -->
  <text font-family="Arial, Helvetica, sans-serif" x="389" y="961" font-size="19">89</text>
</svg>
