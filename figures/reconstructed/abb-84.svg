<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1271 607" width="1271" height="607" data-figure-id="abb-84" data-status="faithful" font-family="Arial, Helvetica, sans-serif">
  <title>Dimensionen der Produktqualität</title>
  <rect x="0" y="0" width="1271" height="607" fill="#ffffff"/>
  <!-- frame of the original figure -->
  <rect x="10" y="10" width="1252" height="588" fill="none" stroke="#555555" stroke-width="2"/>

  <!-- centre: the concept being broken down (given) -->
  <circle cx="623" cy="330" r="118" fill="#e6e6e6" stroke="#404040" stroke-width="1.5"/>
  <text font-family="Arial, Helvetica, sans-serif" x="623" y="298" font-size="31" text-anchor="middle">Produkt-</text>
  <text font-family="Arial, Helvetica, sans-serif" x="623" y="339" font-size="31" text-anchor="middle">qualität</text>

  <!-- eight arrows radiating from the circle to the quality dimensions -->
  <g stroke="#404040" stroke-width="1.3">
  <line x1="623" y1="212" x2="623.0" y2="88.0"/>
  <line x1="692" y1="235" x2="777.4" y2="161.5"/>
  <line x1="733" y1="287" x2="835.0" y2="287.0"/>
  <line x1="721" y1="396" x2="765.9" y2="454.1"/>
  <line x1="623" y1="448" x2="623.0" y2="510.0"/>
  <line x1="526" y1="398" x2="465.2" y2="456.1"/>
  <line x1="509" y1="300" x2="410.0" y2="300.0"/>
  <line x1="555" y1="233" x2="473.5" y2="161.6"/>
  </g>
  <g fill="#404040">
  <polygon points="623,78 627.5,88.0 618.5,88.0"/>
  <polygon points="785,155 780.3,164.9 774.5,158.1"/>
  <polygon points="845,287 835.0,291.5 835.0,282.5"/>
  <polygon points="772,462 762.3,456.9 769.4,451.3"/>
  <polygon points="623,520 618.5,510.0 627.5,510.0"/>
  <polygon points="458,463 462.1,452.8 468.3,459.3"/>
  <polygon points="400,300 410.0,295.5 410.0,304.5"/>
  <polygon points="466,155 476.5,158.2 470.6,165.0"/>
  </g>

  <!-- the eight dimensions after Garvin: German term (bold) + English term -->
  <text font-family="Arial, Helvetica, sans-serif" class="answer" x="623" y="42" font-size="23.5" font-weight="bold" text-anchor="middle">Leistung</text>
  <text font-family="Arial, Helvetica, sans-serif" class="answer" x="623" y="70" font-size="23" text-anchor="middle">(Performance)</text>
  <text font-family="Arial, Helvetica, sans-serif" class="answer" x="845" y="138" font-size="23.5" font-weight="bold" text-anchor="middle">Ausstattung</text>
  <text font-family="Arial, Helvetica, sans-serif" class="answer" x="845" y="166" font-size="23" text-anchor="middle">(Features)</text>
  <text font-family="Arial, Helvetica, sans-serif" class="answer" x="930" y="280" font-size="23.5" font-weight="bold" text-anchor="middle">Zuverlässigkeit</text>
  <text font-family="Arial, Helvetica, sans-serif" class="answer" x="930" y="308" font-size="23" text-anchor="middle">(Reliability)</text>
  <text font-family="Arial, Helvetica, sans-serif" class="answer" x="845" y="466" font-size="23.5" font-weight="bold" text-anchor="middle">Konformität</text>
  <text font-family="Arial, Helvetica, sans-serif" class="answer" x="845" y="494" font-size="23" text-anchor="middle">(Conformance)</text>
  <text font-family="Arial, Helvetica, sans-serif" class="answer" x="623" y="548" font-size="23.5" font-weight="bold" text-anchor="middle">Beständigkeit</text>
  <text font-family="Arial, Helvetica, sans-serif" class="answer" x="623" y="576" font-size="23" text-anchor="middle">(Durability)</text>
  <text font-family="Arial, Helvetica, sans-serif" class="answer" x="369" y="466" font-size="23.5" font-weight="bold" text-anchor="middle">Wartungsfähig</text>
  <text font-family="Arial, Helvetica, sans-serif" class="answer" x="369" y="494" font-size="23" text-anchor="middle">(Serviceability)</text>
  <text font-family="Arial, Helvetica, sans-serif" class="answer" x="330" y="295" font-size="23.5" font-weight="bold" text-anchor="middle">Ästhetik</text>
  <text font-family="Arial, Helvetica, sans-serif" class="answer" x="330" y="323" font-size="23" text-anchor="middle">(Aesthetics)</text>
  <text font-family="Arial, Helvetica, sans-serif" class="answer" x="362" y="138" font-size="23.5" font-weight="bold" text-anchor="middle">Qualitätsimage</text>
  <text font-family="Arial, Helvetica, sans-serif" class="answer" x="362" y="166" font-size="23" text-anchor="middle">(Perceived Quality)</text>
</svg>
