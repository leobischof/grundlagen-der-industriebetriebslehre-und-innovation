<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1276 635" width="1276" height="635" data-figure-id="abb-24" data-status="faithful" font-family="Arial, Helvetica, sans-serif">
  <title>Produktentstehung als Teil des Produktlebenszyklus</title>
