  <text font-size="26" fill="#222222" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" class="answer" x="597" y="120">Produkt-</text>
  <text font-size="26" fill="#222222" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" class="answer" x="597" y="152">entwicklung</text>
  <text font-size="26" fill="#222222" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" class="answer" x="864" y="120">Entwicklung des</text>
  <text font-size="26" fill="#222222" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" class="answer" x="864" y="152">Produktionssystems</text>
  <text font-size="18" fill="#222222" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" x="347" y="193">Kapitel 5.3</text>
