<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1275 701" width="1275" height="701" data-figure-id="abb-41" data-status="faithful" font-family="Arial, Helvetica, sans-serif">
  <title>Zusammenhang der Kenngrößen des Managements</title>
  <rect x="0" y="0" width="1275" height="701" fill="#ffffff"/>
  <!-- frame of the original figure -->
  <rect x="12" y="12" width="1253" height="678" fill="#f7f7f7" stroke="#333333" stroke-width="2"/>

  <!-- thick dark arrows (structure) -->
  <g fill="#3c3c3c">
    <!-- Legitimität -> Zielsystem -->
    <polygon points="295,91 455,91 455,78 500,108 455,138 455,125 295,125"/>
    <!-- Zielsystem -> Effektivität -->
    <polygon points="757,91 925,91 925,78 970,108 925,138 925,125 757,125"/>
    <!-- Zielsystem -> Industrieunternehmung -->
    <polygon points="610,158 646,158 646,195 667,195 628,236 589,195 610,195"/>
    <!-- Effektivität -> Output -->
    <polygon points="1040,188 1075,188 1075,252 1095,252 1057,306 1019,252 1040,252"/>
    <!-- Effizienz -> Input (L-shaped) -->
    <polygon points="547,580 547,612 196,612 196,420 177,420 212,366 247,420 229,420 229,580"/>
    <!-- Effizienz -> Output (L-shaped) -->
    <polygon points="703,580 1041,580 1041,420 1022,420 1057,366 1092,420 1074,420 1074,612 703,612"/>
  </g>

  <!-- Input / Output block arrows -->
  <polygon points="115,300 290,300 290,285 352,335 290,386 290,372 115,372" fill="#c9c9c9" stroke="#222222" stroke-width="2"/>
  <polygon points="930,300 1105,300 1105,285 1168,335 1105,386 1105,372 930,372" fill="#c9c9c9" stroke="#222222" stroke-width="2"/>
  <text font-family="Arial, Helvetica, sans-serif" class="answer" x="219" y="346" font-size="31" text-anchor="middle">Input</text>
  <text font-family="Arial, Helvetica, sans-serif" class="answer" x="1020" y="346" font-size="31" text-anchor="middle">Output</text>

  <!-- target system -->
  <rect x="500" y="50" width="256" height="108" fill="#f3e9e9" stroke="#222222" stroke-width="2"/>
  <text font-family="Arial, Helvetica, sans-serif" class="answer" x="628" y="115" font-size="31" text-anchor="middle">Zielsystem</text>

  <!-- the three management indicators -->
  <g fill="#f7f0f0" stroke="#222222" stroke-width="2">
    <circle cx="215" cy="110" r="80"/>
    <circle cx="1055" cy="110" r="80"/>
    <circle cx="625" cy="598" r="80"/>
  </g>
  <text font-family="Arial, Helvetica, sans-serif" class="answer" x="215" y="120" font-size="31" text-anchor="middle">Legitimität</text>
  <text font-family="Arial, Helvetica, sans-serif" class="answer" x="1055" y="120" font-size="31" text-anchor="middle">Effektivität</text>
  <text font-family="Arial, Helvetica, sans-serif" class="answer" x="625" y="608" font-size="31" text-anchor="middle">Effizienz</text>

  <!-- the industrial company as object of management -->
  <ellipse cx="630" cy="335" rx="228" ry="98" fill="#bdbdbd" stroke="#222222" stroke-width="2"/>
  <text font-family="Arial, Helvetica, sans-serif" class="answer" x="632" y="325" font-size="32" font-weight="bold" text-anchor="middle">Industrieunternehmung</text>
  <text font-family="Arial, Helvetica, sans-serif" class="answer" x="635" y="367" font-size="32" font-weight="bold" text-anchor="middle">als Managementobjekt</text>
</svg>
