  <g stroke="#000" stroke-width="2.5">
    <line x1="338" y1="125" x2="518" y2="125"/>
    <line x1="723" y1="125" x2="914" y2="125"/>
  </g>
  <polygon points="535,125 515,117 515,133" fill="#000"/>
  <polygon points="931,125 911,117 911,133" fill="#000"/>

  <g font-size="27" fill="#ffffff" text-anchor="middle">
    <text font-family="Arial, Helvetica, sans-serif" text-anchor="middle" class="answer" x="240" y="135">Ergebnisse</text>
    <text font-family="Arial, Helvetica, sans-serif" text-anchor="middle" class="answer" x="628" y="135">Kriterien</text>
    <text font-family="Arial, Helvetica, sans-serif" text-anchor="middle" class="answer" x="1026" y="135">Outputs</text>
