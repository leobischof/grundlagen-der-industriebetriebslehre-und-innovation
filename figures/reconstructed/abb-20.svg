<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1271 522" width="1271" height="522" data-figure-id="abb-20" data-status="faithful" font-family="Arial, Helvetica, sans-serif">
  <title>Vergleich zwischen SME- und IDE-Entrepreneurship</title>
