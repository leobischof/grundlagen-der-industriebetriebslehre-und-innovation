<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1266 782" width="1266" height="782" data-figure-id="abb-69" data-status="faithful" font-family="Arial, Helvetica, sans-serif">
  <title>Materialbedarf</title>
  <rect x="0" y="0" width="1266" height="782" fill="#ffffff"/>
  <rect x="10" y="10" width="1245" height="760" fill="none" stroke="#555555" stroke-width="2"/>

  <!-- Tree connectors from the root to the three demand types -->
  <g fill="none" stroke="#bfbfbf" stroke-width="2">
    <path d="M636 127 V155 M217 155 H1047 M217 155 V178 M636 155 V180 M1047 155 V180"/>
  </g>
  <!-- Cross connections: every demand type can be gross or net demand -->
  <g fill="none" stroke="#bfbfbf" stroke-width="1.5">
    <path d="M217 405 L427 523 M217 405 L850 523"/>
    <path d="M636 407 L427 523 M636 407 L850 523"/>
    <path d="M1047 407 L427 523 M1047 407 L850 523"/>
  </g>

  <!-- Root: given as the prompt of the exercise -->
  <rect x="437" y="25" width="397" height="102" fill="#3a3a3a" stroke="#333333" stroke-width="2"/>
  <text font-family="Arial, Helvetica, sans-serif" x="636" y="85" font-size="26" font-weight="bold" fill="#ffffff" text-anchor="middle">Materialbedarfsarten</text>

  <!-- Primärbedarf -->
  <rect x="32" y="178" width="370" height="227" fill="#ffffff" stroke="#7f7f7f" stroke-width="2"/>
  <rect x="32" y="178" width="370" height="55" fill="#e3e3e3" stroke="#7f7f7f" stroke-width="2"/>
  <text font-family="Arial, Helvetica, sans-serif" class="answer" x="217" y="215" font-size="26" text-anchor="middle">Primärbedarf</text>
  <text font-family="Arial, Helvetica, sans-serif" class="answer" x="217" y="268" font-size="26" text-anchor="middle">Bedarf an verkaufsfähigen</text>
  <text font-family="Arial, Helvetica, sans-serif" class="answer" x="217" y="303" font-size="26" text-anchor="middle">Erzeugnissen</text>
  <text font-family="Arial, Helvetica, sans-serif" class="answer" x="217" y="338" font-size="26" text-anchor="middle">(Marktbedarf)</text>

  <!-- Sekundärbedarf -->
  <rect x="453" y="180" width="367" height="227" fill="#ffffff" stroke="#7f7f7f" stroke-width="2"/>
  <rect x="453" y="180" width="367" height="55" fill="#e3e3e3" stroke="#7f7f7f" stroke-width="2"/>
  <text font-family="Arial, Helvetica, sans-serif" class="answer" x="636" y="217" font-size="26" text-anchor="middle">Sekundärbedarf</text>
  <text font-family="Arial, Helvetica, sans-serif" class="answer" x="636" y="268" font-size="26" text-anchor="middle">Bedarf an Rohstoffen,</text>
  <text font-family="Arial, Helvetica, sans-serif" class="answer" x="636" y="303" font-size="26" text-anchor="middle">Teilen und Gruppen zur</text>
  <text font-family="Arial, Helvetica, sans-serif" class="answer" x="636" y="338" font-size="26" text-anchor="middle">Fertigung des</text>
  <text font-family="Arial, Helvetica, sans-serif" class="answer" x="636" y="372" font-size="26" text-anchor="middle">Primärbedarfs</text>

  <!-- Tertiärbedarf -->
  <rect x="871" y="180" width="359" height="227" fill="#ffffff" stroke="#7f7f7f" stroke-width="2"/>
  <rect x="871" y="180" width="359" height="55" fill="#e3e3e3" stroke="#7f7f7f" stroke-width="2"/>
  <text font-family="Arial, Helvetica, sans-serif" class="answer" x="1050" y="217" font-size="26" text-anchor="middle">Tertiärbedarf</text>
  <text font-family="Arial, Helvetica, sans-serif" class="answer" x="1050" y="268" font-size="26" text-anchor="middle">Bedarf an Betriebs- und</text>
  <text font-family="Arial, Helvetica, sans-serif" class="answer" x="1050" y="303" font-size="26" text-anchor="middle">Hilfsstoffen</text>

  <!-- Bruttobedarf -->
  <rect x="243" y="523" width="369" height="226" fill="#ffffff" stroke="#7f7f7f" stroke-width="2"/>
  <rect x="243" y="523" width="369" height="54" fill="#e3e3e3" stroke="#7f7f7f" stroke-width="2"/>
  <text font-family="Arial, Helvetica, sans-serif" class="answer" x="427" y="559" font-size="26" text-anchor="middle">Bruttobedarf</text>
  <text font-family="Arial, Helvetica, sans-serif" class="answer" x="427" y="613" font-size="26" text-anchor="middle">Periodenbezogener</text>
  <text font-family="Arial, Helvetica, sans-serif" class="answer" x="427" y="646" font-size="26" text-anchor="middle">Primär-, Sekundär- oder</text>
  <text font-family="Arial, Helvetica, sans-serif" class="answer" x="427" y="679" font-size="26" text-anchor="middle">Tertiärbedarf</text>

  <!-- Nettobedarf -->
  <rect x="663" y="523" width="362" height="228" fill="#ffffff" stroke="#7f7f7f" stroke-width="2"/>
  <rect x="663" y="523" width="362" height="54" fill="#e3e3e3" stroke="#7f7f7f" stroke-width="2"/>
  <text font-family="Arial, Helvetica, sans-serif" class="answer" x="844" y="559" font-size="26" text-anchor="middle">Nettobedarf</text>
  <text font-family="Arial, Helvetica, sans-serif" class="answer" x="844" y="613" font-size="26" text-anchor="middle">Bruttobedarf abzüglich</text>
  <text font-family="Arial, Helvetica, sans-serif" class="answer" x="844" y="646" font-size="26" text-anchor="middle">verfügbarem</text>
  <text font-family="Arial, Helvetica, sans-serif" class="answer" x="844" y="679" font-size="26" text-anchor="middle">Lagerbestand</text>
</svg>
