<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1277 735" width="1277" height="735" data-figure-id="abb-05" data-status="faithful" font-family="Arial, Helvetica, sans-serif">
  <title>Drei generische Strategien, die Unternehmen verfolgen können</title>
  <rect x="0" y="0" width="1277" height="735" fill="#ffffff"/>
  <!-- outer frame of the original figure -->
  <rect x="12" y="8" width="1252" height="716" fill="none" stroke="#333333" stroke-width="2"/>

  <!-- column dimension: Strategischer Vorteil -->
  <text font-family="Arial, Helvetica, sans-serif" class="answer" x="772" y="64" font-size="37" text-anchor="middle">Strategischer Vorteil</text>
  <text font-family="Arial, Helvetica, sans-serif" class="answer" x="565" y="120" font-size="24" text-anchor="middle">Einzigartigkeit aus der Sicht</text>
  <text font-family="Arial, Helvetica, sans-serif" class="answer" x="565" y="152" font-size="24" text-anchor="middle">des Käufers</text>
  <text font-family="Arial, Helvetica, sans-serif" class="answer" x="975" y="136" font-size="24" text-anchor="middle">Kostenvorsprung</text>

  <!-- row dimension: Strategisches Zielobjekt -->
  <text font-family="Arial, Helvetica, sans-serif" class="answer" x="238" y="312" font-size="23" text-anchor="middle">Branchenweit</text>
  <text font-family="Arial, Helvetica, sans-serif" class="answer" x="180" y="421" font-size="36" text-anchor="middle">Strategisches</text>
  <text font-family="Arial, Helvetica, sans-serif" class="answer" x="164" y="469" font-size="36" text-anchor="middle">Zielobjekt</text>
  <text font-family="Arial, Helvetica, sans-serif" class="answer" x="238" y="561" font-size="23" text-anchor="middle">Beschränkung</text>
  <text font-family="Arial, Helvetica, sans-serif" class="answer" x="238" y="593" font-size="23" text-anchor="middle">auf ein Segment</text>

  <!-- 2x2 matrix grid -->
  <rect x="347" y="168" width="850" height="530" fill="none" stroke="#222222" stroke-width="2.5"/>
  <g stroke="#888888" stroke-width="1.5">
    <line x1="347" y1="434" x2="1197" y2="434"/>
    <line x1="770" y1="168" x2="770" y2="434"/>
    <line x1="770" y1="473" x2="770" y2="548"/>
    <line x1="770" y1="648" x2="770" y2="698"/>
  </g>

  <!-- the three generic strategies -->
  <text font-family="Arial, Helvetica, sans-serif" class="answer" x="563" y="316" font-size="37" text-anchor="middle">Differenzierung</text>
  <text font-family="Arial, Helvetica, sans-serif" class="answer" x="977" y="292" font-size="37" text-anchor="middle">Umfassende</text>
  <text font-family="Arial, Helvetica, sans-serif" class="answer" x="977" y="340" font-size="37" text-anchor="middle">Kostenführerschaft</text>
  <text font-family="Arial, Helvetica, sans-serif" class="answer" x="770" y="588" font-size="37" text-anchor="middle">Fokussierung</text>
  <text font-family="Arial, Helvetica, sans-serif" class="answer" x="770" y="636" font-size="37" text-anchor="middle">(Konzentration auf Schwerpunkte)</text>

  <!-- stuck in the middle, dark box over the centre of the grid -->
  <rect x="550" y="393" width="447" height="80" fill="#262626"/>
  <text font-family="Arial, Helvetica, sans-serif" class="answer" x="773" y="447" font-size="37" fill="#ffffff" text-anchor="middle">Zwischen den Stühlen</text>
</svg>
