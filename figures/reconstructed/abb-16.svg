<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1264 618" width="1264" height="618" data-figure-id="abb-16" data-status="faithful" font-family="Arial, Helvetica, sans-serif">
  <title>Der Produktionsprozess</title>
  <rect x="0" y="0" width="1264" height="618" fill="#ffffff"/>
  <rect x="10" y="10" width="1242" height="594" fill="none" stroke="#555555" stroke-width="2"/>

  <!-- Production environment: the ellipse that frames the throughput -->
  <ellipse cx="622" cy="330" rx="290" ry="168" fill="#e8e8e8" stroke="#333333" stroke-width="2"/>

  <!-- Input and output arrows (structure, not part of the answer) -->
  <polygon points="48,293 375,293 375,265 430,323 375,383 375,355 48,355" fill="#707070" stroke="#555555" stroke-width="2"/>
  <polygon points="848,293 1160,293 1160,265 1215,323 1160,380 1160,352 848,352" fill="#707070" stroke="#555555" stroke-width="2"/>

  <!-- Target values come in from above (Soll), actual values go out (Ist) -->
  <polygon points="403,97 428,97 428,215 440,215 416,255 392,215 403,215" fill="#707070" stroke="#555555" stroke-width="2"/>
  <polygon points="838,255 860,255 860,125 873,125 849,98 825,125 838,125" fill="#707070" stroke="#555555" stroke-width="2"/>

  <!-- The transformation itself, drawn as a chevron -->
  <polygon points="453,268 762,268 808,323 762,378 453,378 500,323" fill="#6b6b6b" stroke="#555555" stroke-width="2"/>
  <text font-family="Arial, Helvetica, sans-serif" class="answer" x="622" y="306" font-size="32" font-weight="bold" fill="#ffffff" text-anchor="middle">Produktion-</text>
  <text font-family="Arial, Helvetica, sans-serif" class="answer" x="622" y="350" font-size="32" font-weight="bold" fill="#ffffff" text-anchor="middle">prozess</text>

  <text font-family="Arial, Helvetica, sans-serif" class="answer" x="412" y="72" font-size="27" text-anchor="middle">Soll</text>
  <text font-family="Arial, Helvetica, sans-serif" class="answer" x="631" y="60" font-size="24" font-weight="bold" text-anchor="middle">Unternehmungsziele</text>
  <text font-family="Arial, Helvetica, sans-serif" class="answer" x="631" y="94" font-size="24" font-weight="bold" text-anchor="middle">Produktionsziele</text>
  <text font-family="Arial, Helvetica, sans-serif" class="answer" x="849" y="72" font-size="27" text-anchor="middle">Ist</text>
  <text font-family="Arial, Helvetica, sans-serif" class="answer" x="600" y="222" font-size="26" font-weight="bold" text-anchor="middle">Throughput</text>
  <text font-family="Arial, Helvetica, sans-serif" class="answer" x="596" y="420" font-size="26" font-weight="bold" text-anchor="middle">Produktionsumfeld</text>

  <text font-family="Arial, Helvetica, sans-serif" class="answer" x="196" y="262" font-size="27" font-weight="bold" text-anchor="middle">INPUT</text>
  <text font-family="Arial, Helvetica, sans-serif" class="answer" x="200" y="478" font-size="27" text-anchor="middle">Produktionsfaktoren</text>

  <text font-family="Arial, Helvetica, sans-serif" class="answer" x="1022" y="262" font-size="27" font-weight="bold" text-anchor="middle">OUTPUT</text>
  <text font-family="Arial, Helvetica, sans-serif" class="answer" x="877" y="459" font-size="27">Produkte/Leistungen</text>
  <text font-family="Arial, Helvetica, sans-serif" class="answer" x="877" y="499" font-size="27">Belastungen</text>
  <text font-family="Arial, Helvetica, sans-serif" class="answer" x="877" y="539" font-size="27">(Absatzwirtschaft)</text>
</svg>
