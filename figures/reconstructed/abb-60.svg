    <path d="M716 220 V346 M716 490 V609"/><polygon points="716.0,609.0 721.5,596.0 710.5,596.0" fill="#777777"/>
    <!-- Realisierung der Produktion -> Auftrag -> Produktion -->
    <path d="M855 220 V262"/>
    <path d="M855 312 V343"/><polygon points="855.0,343.0 860.5,330.0 849.5,330.0" fill="#777777"/>
    <!-- links between Produktion and Beschaffung -->
    <path d="M470 612 V490 M668 612 V490 M960 612 V490"/>
    <path d="M572 612 V493"/><polygon points="572.0,493.0 566.5,506.0 577.5,506.0" fill="#777777"/>
  </g>

  <!-- Side boxes -->
  <rect x="37" y="348" width="251" height="88" fill="#ffffff" stroke="#666666" stroke-width="1.5"/>
  <rect x="788" y="262" width="137" height="50" fill="#ffffff" stroke="#666666" stroke-width="1.5"/>

