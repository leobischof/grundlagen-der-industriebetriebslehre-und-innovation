<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1277 654" width="1277" height="654" data-figure-id="abb-56" data-status="faithful" font-family="Arial, Helvetica, sans-serif">
  <title>Beispiele für das Spannungsfeld unternehmerischen Wirkens</title>
