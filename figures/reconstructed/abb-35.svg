<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1263 730" width="1263" height="730"
     data-figure-id="abb-35" data-status="faithful"
     font-family="Arial, Helvetica, sans-serif">
  <title>Integrationsbereiche der Themen Innovationsprozess &amp; Produktentwicklung</title>
  <desc>Rekonstruktion von Abbildung 35 (Skript S. 93, PDF 103): Venn-Diagramm der drei Hauptaufgabenbereiche der Produktentstehung und ihrer vier Integrationsbereiche.</desc>
  <rect x="0" y="0" width="1263" height="730" fill="#ffffff"/>
  <!-- frame of the original figure -->
  <rect x="9" y="9" width="1245" height="709" fill="none" stroke="#000" stroke-width="2"/>

  <!-- enclosing circle: Produktentstehung as a whole -->
  <circle cx="636" cy="308" r="280" fill="none" stroke="#555" stroke-width="1.5"/>

  <!-- three task areas; translucent fills make the overlaps darker as in the original -->
  <circle cx="630" cy="192" r="158" fill="#000" fill-opacity="0.07" stroke="#666" stroke-width="1.5"/>
  <circle cx="536" cy="372" r="157" fill="#000" fill-opacity="0.63" stroke="#333" stroke-width="1.5"/>
  <circle cx="737" cy="373" r="156" fill="#000" fill-opacity="0.45" stroke="#444" stroke-width="1.5"/>

  <!-- leader lines from the integration areas to their labels -->
  <g stroke="#333" stroke-width="1.3">
    <line x1="278" y1="161" x2="553" y2="268"/>
    <line x1="945" y1="163" x2="715" y2="265"/>
    <line x1="318" y1="602" x2="637" y2="398"/>
    <line x1="775" y1="628" x2="632" y2="312"/>
  </g>
  <g fill="#000">
    <circle cx="553" cy="268" r="4"/>
    <circle cx="715" cy="265" r="4"/>
    <circle cx="637" cy="398" r="4"/>
    <circle cx="632" cy="312" r="4"/>
  </g>

  <!-- task areas -->
  <text font-family="Arial, Helvetica, sans-serif" class="answer" x="630" y="133" font-size="29" fill="#222" text-anchor="middle"><tspan x="630">Strategische</tspan><tspan x="630" dy="39">Produktplanung</tspan></text>
  <text font-family="Arial, Helvetica, sans-serif" class="answer" x="487" y="376" font-size="29" fill="#ffffff" text-anchor="middle"><tspan x="487">Produkt-</tspan><tspan x="487" dy="39">entwicklung</tspan></text>
  <text font-family="Arial, Helvetica, sans-serif" class="answer" x="778" y="366" font-size="29" fill="#ffffff" text-anchor="middle"><tspan x="778">Produktions-</tspan><tspan x="778" dy="39">system-</tspan><tspan x="778" dy="39">entwicklung</tspan></text>

  <!-- integration areas (original spelling "Produktenwicklung" kept) -->
  <text font-family="Arial, Helvetica, sans-serif" class="answer" x="42" y="172" font-size="29"><tspan x="42">Strategische</tspan><tspan x="42" dy="39">Produktenwicklung</tspan></text>
  <text font-family="Arial, Helvetica, sans-serif" class="answer" x="965" y="137" font-size="29"><tspan x="965">Strategische</tspan><tspan x="965" dy="39">Produktionssystem-</tspan><tspan x="965" dy="39">entwicklung</tspan></text>
  <text font-family="Arial, Helvetica, sans-serif" class="answer" x="33" y="574" font-size="29"><tspan x="33">Integrierte Produkt-</tspan><tspan x="33" dy="38">und</tspan><tspan x="33" dy="38">Produktionssystem-</tspan><tspan x="33" dy="38">entwicklung</tspan></text>
  <text font-family="Arial, Helvetica, sans-serif" class="answer" x="788" y="646" font-size="29"><tspan x="788">Kooperationskern</tspan><tspan x="788" dy="39">“Systems Engineering”</tspan></text>
</svg>
