<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1277 752" width="1277" height="752" data-figure-id="abb-78" data-status="faithful" font-family="Arial, Helvetica, sans-serif">
  <title>Produktionsregelkreis</title>
