<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1265 619" width="1265" height="619" data-figure-id="abb-25" data-status="faithful" font-family="Arial, Helvetica, sans-serif">
  <title>Zielsystem, Handlungssystem und Sachsystem</title>
