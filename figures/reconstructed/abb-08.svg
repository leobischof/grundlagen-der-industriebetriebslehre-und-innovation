  <g font-size="19.5" fill="#000">
    <g class="answer">
      <text font-family="Arial, Helvetica, sans-serif" x="168" y="127">•</text>
      <text font-family="Arial, Helvetica, sans-serif" x="201" y="127"><tspan x="201">Einführung</tspan><tspan x="201" dy="28">des</tspan><tspan x="201" dy="28">Produkts</tspan><tspan x="201" dy="28">mit geringer</tspan><tspan x="201" dy="28">Stückzahl</tspan></text>
      <text font-family="Arial, Helvetica, sans-serif" x="168" y="267">•</text>
      <text font-family="Arial, Helvetica, sans-serif" x="201" y="267"><tspan x="201">Marketing</tspan><tspan x="201" dy="28">zur</tspan><tspan x="201" dy="28">Marktvorber</tspan><tspan x="201" dy="28">eitung</tspan></text>
    </g>
    <g class="answer">
      <text font-family="Arial, Helvetica, sans-serif" x="376" y="127">•</text>
      <text font-family="Arial, Helvetica, sans-serif" x="411" y="127"><tspan x="411">Produkt</tspan><tspan x="411" dy="28">setzt sich</tspan><tspan x="411" dy="28">am Markt</tspan><tspan x="411" dy="28">durch</tspan></text>
      <text font-family="Arial, Helvetica, sans-serif" x="376" y="239">•</text>
      <text font-family="Arial, Helvetica, sans-serif" x="411" y="239"><tspan x="411">Stark</tspan><tspan x="411" dy="28">steigende</tspan><tspan x="411" dy="28">Umsätze</tspan></text>
      <text font-family="Arial, Helvetica, sans-serif" x="376" y="323">•</text>
      <text font-family="Arial, Helvetica, sans-serif" x="411" y="323"><tspan x="411">Marketing</tspan><tspan x="411" dy="28">für höhere</tspan><tspan x="411" dy="28">Nachfrage</tspan></text>
    </g>
    <g class="answer">
      <text font-family="Arial, Helvetica, sans-serif" x="579" y="127">•</text>
      <text font-family="Arial, Helvetica, sans-serif" x="614" y="127"><tspan x="614">Variationen</tspan><tspan x="614" dy="28">sorgen für</tspan><tspan x="614" dy="28">geringfügig</tspan><tspan x="614" dy="28">steigende</tspan><tspan x="614" dy="28">Umsätze</tspan></text>
      <text font-family="Arial, Helvetica, sans-serif" x="579" y="267">•</text>
      <text font-family="Arial, Helvetica, sans-serif" x="614" y="267"><tspan x="614">Marketing</tspan><tspan x="614" dy="28">für mehr</tspan><tspan x="614" dy="28">Marktanteile</tspan></text>
    </g>
    <g class="answer">
      <text font-family="Arial, Helvetica, sans-serif" x="779" y="127">•</text>
      <text font-family="Arial, Helvetica, sans-serif" x="814" y="127"><tspan x="814">Nachfrage ist</tspan><tspan x="814" dy="28">gesättigt</tspan></text>
      <text font-family="Arial, Helvetica, sans-serif" x="779" y="183">•</text>
      <text font-family="Arial, Helvetica, sans-serif" x="814" y="183"><tspan x="814">Marketing</tspan><tspan x="814" dy="28">zum erhalten</tspan><tspan x="814" dy="28">bzw.</tspan><tspan x="814" dy="28">erweitern von</tspan><tspan x="814" dy="28">Marktanteilen</tspan></text>
    </g>
    <g class="answer">
      <text font-family="Arial, Helvetica, sans-serif" x="986" y="127">•</text>
      <text font-family="Arial, Helvetica, sans-serif" x="1022" y="127"><tspan x="1022">Umsätze</tspan><tspan x="1022" dy="28">gehen zurück</tspan></text>
      <text font-family="Arial, Helvetica, sans-serif" x="986" y="183">•</text>
      <text font-family="Arial, Helvetica, sans-serif" x="1020" y="183"><tspan x="1020">Marketing</tspan><tspan x="1020" dy="28">stark</tspan><tspan x="1020" dy="28">reduziert</tspan></text>
      <text font-family="Arial, Helvetica, sans-serif" x="986" y="267">•</text>
      <text font-family="Arial, Helvetica, sans-serif" x="1020" y="267"><tspan x="1020">Neue</tspan><tspan x="1020" dy="28">Produkte</tspan><tspan x="1020" dy="28">werden</tspan><tspan x="1020" dy="28">vorbereitet</tspan></text>
