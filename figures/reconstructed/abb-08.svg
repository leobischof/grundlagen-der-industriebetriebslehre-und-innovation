  <rect x="0" y="0" width="1266" height="840" fill="#ffffff"/>
  <!-- frame of the original figure -->
  <rect x="10" y="8" width="1245" height="820" fill="none" stroke="#000" stroke-width="2"/>

  <!-- phase separators (dotted, light grey) -->
  <g stroke="#9a9a9a" stroke-width="1.5" stroke-dasharray="5 5">
    <line x1="343" y1="22" x2="343" y2="788"/>
    <line x1="550" y1="22" x2="550" y2="788"/>
    <line x1="760" y1="22" x2="760" y2="788"/>
    <line x1="962" y1="22" x2="962" y2="788"/>
  </g>

  <!-- axes -->
