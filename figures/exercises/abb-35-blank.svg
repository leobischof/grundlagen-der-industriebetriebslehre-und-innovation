  <title>Integrationsbereiche der Themen Innovationsprozess &amp; Produktentwicklung – Zeichenübung (leer)</title>
  <desc>Leere Zeichenübung: 7 Lösungselemente entfernt; gestrichelte Kästen markieren, wo Text hingehört.</desc>
  <rect x="0" y="0" width="1263" height="730" fill="#ffffff" />
  <!-- frame of the original figure -->
  <rect x="9" y="9" width="1245" height="709" fill="none" stroke="#000" stroke-width="2" />

  <!-- enclosing circle: Produktentstehung as a whole -->
