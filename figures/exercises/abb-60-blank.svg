    <path d="M38 35 H1195 L1237 128 L1195 220 H38 Z" />
    <path d="M370 346 H1195 L1237 418 L1195 490 H370 Z" />
    <path d="M370 612 H1195 L1237 682 L1195 752 H370 Z" />
  </g>

  <!-- Chevron sequence of the planning process (light to dark) -->
  <path d="M70 118 H285 L315 168 L285 220 H70 Z" fill="#f1eeee" />
  <path d="M285 118 H490 L520 168 L490 220 H285 L315 168 Z" fill="#e9e3e3" />
  <path d="M490 118 H695 L725 168 L695 220 H490 L520 168 Z" fill="#bcbcbc" />
