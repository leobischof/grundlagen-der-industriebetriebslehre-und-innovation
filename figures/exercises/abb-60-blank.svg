  <title>Produktionsprogrammplanung – Zeichenübung (leer)</title>
  <rect x="0" y="0" width="1276" height="796" fill="#ffffff" />
  <rect x="12" y="8" width="1252" height="778" fill="none" stroke="#333333" stroke-width="2" />

  <!-- Three large outline arrows: planning process, production, procurement -->
