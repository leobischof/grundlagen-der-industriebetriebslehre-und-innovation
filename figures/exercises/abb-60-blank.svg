  <path d="M868 674 H1065 L1095 712 L1065 750 H868 L898 712 Z" fill="#a3a3a3" />

  <!-- Connectors (structure, not part of the answer) -->
  <g fill="none" stroke="#888888" stroke-width="1.3">
    <!-- feedback from Produktionskontrolle back to the first three planning steps -->
    <path d="M1022 118 V83 H172" />
    <path d="M172 83 V115" /><polygon points="172.0,115.0 177.5,102.0 166.5,102.0" fill="#777777" />
    <path d="M397 83 V115" /><polygon points="397.0,115.0 402.5,102.0 391.5,102.0" fill="#777777" />
    <path d="M604 83 V115" /><polygon points="604.0,115.0 609.5,102.0 598.5,102.0" fill="#777777" />
    <!-- Planung des Produktionsprogramms -> Produktionsprogramm -->
    <path d="M172 220 V345" /><polygon points="172.0,345.0 177.5,332.0 166.5,332.0" fill="#777777" />
    <!-- Produktion -> planning steps -->
    <path d="M466 346 V223" /><polygon points="466.0,223.0 460.5,236.0 471.5,236.0" fill="#777777" />
    <path d="M668 346 V223" /><polygon points="668.0,223.0 662.5,236.0 673.5,236.0" fill="#777777" />
    <path d="M960 346 V223" /><polygon points="960.0,223.0 954.5,236.0 965.5,236.0" fill="#777777" />
    <path d="M1072 346 V223" /><polygon points="1072.0,223.0 1066.5,236.0 1077.5,236.0" fill="#777777" />
    <!-- Realisierung der Produktion -> Beschaffung (runs behind Produktion) -->
    <path d="M716 220 V346 M716 490 V609" /><polygon points="716.0,609.0 721.5,596.0 710.5,596.0" fill="#777777" />
    <!-- Realisierung der Produktion -> Auftrag -> Produktion -->
    <path d="M855 220 V262" />
    <path d="M855 312 V343" /><polygon points="855.0,343.0 860.5,330.0 849.5,330.0" fill="#777777" />
    <!-- links between Produktion and Beschaffung -->
    <path d="M470 612 V490 M668 612 V490 M960 612 V490" />
    <path d="M572 612 V493" /><polygon points="572.0,493.0 566.5,506.0 577.5,506.0" fill="#777777" />
  </g>

