  <path d="M905 118 H1135 L1165 168 L1135 220 H905 L935 168 Z" fill="#4d4d4d" />

  <!-- Chevrons inside Produktion and Beschaffung -->
  <path d="M447 410 H770 L800 449 L770 488 H447 Z" fill="#f1eded" />
  <path d="M770 410 H1075 L1105 449 L1075 488 H770 L800 449 Z" fill="#ece6e6" />
