<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1275 541" width="1275" height="541" data-figure-id="abb-11" data-status="faithful" font-family="Arial, Helvetica, sans-serif" data-exercise="blank">
  <title>Ansoff Matrix – Zeichenübung (leer)</title>
  <desc>Leere Zeichenübung: 8 Lösungselemente entfernt; gestrichelte Kästen markieren, wo Text hingehört.</desc>
  <rect x="0" y="0" width="1275" height="541" fill="#ffffff" />
  <!-- frame of the original figure -->
  <rect x="10" y="10" width="1255" height="518" fill="none" stroke="#000" stroke-width="2" />

  <!-- 2x2 grid -->
  <g stroke="#000" stroke-width="2.5" fill="none">
    <rect x="418" y="103" width="569" height="405" />
    <line x1="702" y1="103" x2="702" y2="508" />
    <line x1="418" y1="305" x2="987" y2="305" />
  </g>

  <!-- column headers: products -->
