id: abb-41
title: Zusammenhang der Kenngrößen des Managements
type: system
description: >-
  Systembild: In der Mitte die graue Ellipse „Industrieunternehmung als Managementobjekt“ mit einem
  Blockpfeil „Input“ links hinein und „Output“ rechts hinaus. Oben links der Kreis „Legitimität“,
  der mit einem dicken Pfeil auf das Kästchen „Zielsystem“ zeigt; vom Zielsystem gehen dicke Pfeile
  nach unten auf die Ellipse und nach rechts auf den Kreis „Effektivität“, der wiederum auf den
  Output zeigt. Unten der Kreis „Effizienz“, von dem zwei L-förmige dicke Pfeile nach links zum
  Input und nach rechts zum Output führen.
