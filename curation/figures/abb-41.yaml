curves: []
meaning: >-
  Die drei Kenngrößen des Managements (sec-7.1): Legitimität für das normative Management („Die
  Gesamtaufgabe erfüllen“), Effektivität für das strategische Management („Die richtigen Dinge
  tun“, Pflege und Ausbau strategischer Erfolgspositionen) und Effizienz für das operative
  Management („Die Dinge richtig tun“, Einhaltung des Rationalprinzips, Verhältnis von Output zu
  Input). Legitimität prägt das Zielsystem, Effektivität misst den Output am Zielsystem, Effizienz
  setzt Output und Input ins Verhältnis.
exam_relevance:
  level: mittel
  reason: >-
    In exams/topic-mapping.json keiner Prüfungsfrage direkt zugeordnet. Die Unterscheidung
    Effektivität („die richtigen Dinge tun“) vs. Effizienz („die Dinge richtig tun“) ist aber
    Grundwissen und eng mit der geprüften Frage zu den Funktionen des Industriemanagements (7.1)
    verbunden.
  question_ids: []
drawing:
  difficulty: mittel
  must_know:
    - "Legitimität → Zielsystem → Effektivität → Output"
    - "Effizienz verbindet Input und Output"
    - "Zuordnung: Legitimität = normativ, Effektivität = strategisch, Effizienz = operativ"
  common_mistakes:
    - "Effektivität und Effizienz vertauschen"
    - "Effizienz nur mit dem Output statt mit Input und Output verbinden"
reconstruction:
  status: faithful
  svg: figures/reconstructed/abb-41.svg
  notes: >-
    Per Nebeneinander-Vergleich mit dem Original geprüft; Positionen, Pfeilstärken und Farbtöne
    (sehr helles Rosa der Kreise und des Zielsystems, Grau für Ellipse und Input/Output) angenähert.
    Die dicken Pfeile sind als gefüllte Polygone gezeichnet, das sehr hellgraue Bildfeld ist
    einfarbig wiedergegeben.
