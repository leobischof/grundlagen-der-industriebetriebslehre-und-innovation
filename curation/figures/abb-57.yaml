id: abb-57
title: Einfluss von Effizienz, Konsistenz und Suffizienz auf Aufwand und Ertrag
type: kurvendiagramm
description: >-
  Aufwands-Ertrags-Diagramm: x-Achse „Ressourcenverbrauch“ von „Nachhaltig“ nach „Ausbeutend“,
  y-Achse „Wirtschaftlicher Erfolg“ von „Gering“ nach „Hoch“. Drei Geraden aus dem Ursprung
  stehen für Produktivitäten: „Produktivität p1 = konst.“ (flach), „p2 > p1“ (steiler) und
  „p3 >> p1“ (sehr steil). Vom Ausgangspunkt A auf p1 führen drei Pfeile: „Effizienz“ nach B
  (auf p2, etwas weniger Ressourcen, mehr Erfolg), „Suffizienz (Verzicht)“ nach C (auf p1, weniger
  Ressourcen und weniger Erfolg) und „Konsistenz“ nach D (auf p3, viel weniger Ressourcen, mehr
  Erfolg). Ein großer gebogener Pfeil oben trägt den Text „Technologie-innovation Nötig für Netto
  Null“; ein grauer Keil um p1 und zwei gestrichelte senkrechte Linien begrenzen den Bereich.
