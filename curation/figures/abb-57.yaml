  - {name: p2 > p1, shape: "Gerade aus dem Ursprung, steiler", key_points: "B"}
  - {name: p3 >> p1, shape: "Gerade aus dem Ursprung, sehr steil", key_points: "D"}
meaning: >-
  Skript 8.3.3 (angelehnt an Schmidt 2008): Effizienz verbessert das Input-Output-Verhältnis und
  kann Ertrag steigern und Ressourcen schonen, beides aber nur begrenzt (A → B). Suffizienz
  (genügsameres Konsumverhalten, freiwilliger Verzicht oder politische Maßnahmen) wirkt stärker
  in Richtung eines akzeptablen Ressourcenverbrauchs, senkt aber zwangsläufig den Ertrag (A → C).
  Das größte Potential hat die durch technische Innovationen ermöglichte Konsistenz
  (Öko-Effektivität, z. B. biologisch abbaubare Rohstoffe, erneuerbare Energie,
  Kreislaufwirtschaft) (A → D): ähnlich wie Effizienz (höhere Produktivität, kein verringerter
  Ertrag), aber weitaus radikaler. Laut Abbildung ist Technologie-Innovation für Netto Null nötig.
