meaning: >-
  Die Abbildung verortet das Industrieunternehmen im System der Wirtschaftseinheiten: Es ist ein
  Produktionsunternehmen, das Sachgüter anbietet, und grenzt sich so von Haushalten, von
  Dienstleistungsanbietern (Handel, Banken, Versicherungen, Transport) sowie innerhalb der
  Sachgüteranbieter von landwirtschaftlichen Unternehmen und Werkstattbetrieben ab. Laut Skript ist
  ein Industrieunternehmen eine technische, soziale, wirtschaftliche und umweltbezogene Einheit zur
  kommerziellen Produktion von Waren innerhalb eines Fabriksystems mit dem Ziel, externe
  Bedürfnisse zu befriedigen, indem es unabhängige Entscheidungen trifft und Risiken eingeht
  (Skript 3.1, S. 47).
exam_relevance:
  level: hoch
  reason: >-
    Laut exams/topic-mapping.json direkt zur Frage 2025-03-18-3 „Wie ist der Begriff
    Industrieunternehmen definiert und wo liegen die Unterschiede zu anderen Wirtschaftseinheiten?“
    – die Abbildung liefert genau die Abgrenzung zu den anderen Wirtschaftseinheiten.
  question_ids: [frage-2025-03-18-3]
drawing:
  difficulty: mittel
  must_know:
    - "Wirtschaftseinheiten → Produktionsunternehmen und Haushalte"
    - "Produktionsunternehmen → Anbieter von Sachgütern und Anbieter von Dienstleistungen"
    - "Sachgüter → Materialproduktion und Materialverarbeitung → Landwirtschaft, Industrie, Werkstatt"
    - "Dienstleistungen → Handel, Banken, Versicherungen, Transport"
  common_mistakes:
    - "Haushalte unter Produktionsunternehmen statt neben ihnen eingeordnet"
    - "Industrieunternehmen unter die Dienstleistungsanbieter gesetzt"
    - "Werkstattbetriebe und Landwirtschaft vergessen (gerade sie grenzen die Industrie ab)"
reconstruction:
