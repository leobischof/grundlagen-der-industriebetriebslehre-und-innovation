id: abb-12
title: Industriebetriebe im System der Wirtschaftseinheiten
type: hierarchie
description: >-
  Baumdiagramm: Die Wirtschaftseinheiten teilen sich (mit Pfeilen) in Produktionsunternehmen und
  Haushalte. Produktionsunternehmen gliedern sich in Anbieter von Sachgüter und Anbieter von
  Dienstleistungen. Anbieter von Sachgütern teilen sich in Materialproduktionsunternehmen und
  Materialverarbeitende Unternehmen; beide münden gemeinsam in Landwirtschaftliche Unternehmen,
  Industrieunternehmen (fett und umrahmt hervorgehoben) und Werkstattbetriebe. Anbieter von
  Dienstleistungen verzweigen in Handels-, Banken, Versicherungs- und Transportunternehmen.
