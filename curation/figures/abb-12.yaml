  notes: >-
    Per Nebeneinander-Vergleich mit dem Original geprüft; Verbindungslinien, die beiden Pfeile unter
    „Wirtschaftseinheiten“ und der gemeinsame Verteiler beider Materialäste wie im Original.
    „Industrieunternehmen“ fett und umrahmt hervorgehoben. Wortlaut „Anbieter von Sachgüter“
    unverändert übernommen (grammatisch „Sachgütern“). Die Wurzel „Wirtschaftseinheiten“ bleibt als
    Vorgabe ohne class="answer", alle anderen Texte sind class="answer".
