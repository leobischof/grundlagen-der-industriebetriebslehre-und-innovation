meaning: >-
  Im Industriebetrieb erfolgt die Produktion hauptsächlich mit maschinellen Anlagen bei weitgehender
  Arbeitsteilung und Spezialisierung der Beschäftigten – im Unterschied zum Handwerksbetrieb bzw.
  zur Werkstatt. Industrieunternehmen sind daher groß, stark mechanisiert, arbeitsteilig und auf
  große Auftragsvolumina ausgelegt; Werkstätten sind personenbezogen, kundennah und stark
  differenziert in ihren Produkten (Skript 3.1.1, S. 48–49).
