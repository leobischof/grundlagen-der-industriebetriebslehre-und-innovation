id: abb-14
title: Abgrenzung zwischen Industriebetrieben und Werkstätten
type: sonstiges
description: >-
  Profildiagramm (Polaritätenprofil) mit sieben Merkmalsspalten: Unternehmensgröße,
  Mechanisierung, Personenbezogen, Nähe zum Kunden, Differenzierung der Produkte, Auftragsvolumen,
  Aufteilung der Arbeit. Eine Skala links reicht von Groß (hoch) oben bis Klein (niedrig) unten. In
  jeder Spalte liegt ein schwarzer Punkt für Werkstätten und ein grauer Punkt für
  Industrieunternehmen; die Punkte sind je Typ gestrichelt verbunden. Die beiden Profile sind
  spiegelbildlich und kreuzen sich zweimal.
