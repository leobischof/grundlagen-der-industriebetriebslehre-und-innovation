curves: []
meaning: >-
  Skript 9.1.3.1: Der Materialbedarf kennzeichnet Art und Menge des Materials für die Herstellung
  bzw. die Belieferung des Absatzmarktes. Primärbedarf ist der Bedarf an Produkten
  („Marktbedarf“), der abhängige (sekundäre) Bedarf der Bedarf an Baugruppen, Komponenten und
  Rohmaterial für den Primärbedarf, der Tertiärbedarf der Bedarf an Hilfsstoffen (laut Abbildung
  Betriebs- und Hilfsstoffe). Bei der Bestandsaufnahme wird zusätzlich zwischen Bruttobedarf
  (periodenbezogen, ohne Vorräte) und Nettobedarf (Bruttobedarf minus verfügbarer Bestand)
  unterschieden.
exam_relevance:
  level: hoch
  reason: >-
    Laut exams/topic-mapping.json am 2025-06-16 abgefragt (Primär-, Sekundär-, Tertiär-, Brutto-
    und Nettobedarf definieren); die Abbildung enthält genau diese fünf Definitionen.
  question_ids: [frage-2025-06-16-5]
drawing:
  difficulty: leicht
  must_know:
    - "Drei Bedarfsarten: Primär-, Sekundär-, Tertiärbedarf mit je einer Definition"
    - "Primärbedarf = Marktbedarf an verkaufsfähigen Erzeugnissen"
    - "Sekundärbedarf = Rohstoffe, Teile und Gruppen zur Fertigung des Primärbedarfs"
    - "Tertiärbedarf = Betriebs- und Hilfsstoffe"
    - "Nettobedarf = Bruttobedarf abzüglich verfügbarem Lagerbestand"
  common_mistakes:
    - "Brutto-/Nettobedarf als vierte und fünfte Bedarfsart neben Primär- bis Tertiärbedarf gezeichnet statt als Betrachtung, die für jede Bedarfsart gilt"
    - "Sekundär- und Tertiärbedarf vertauscht"
    - "Nettobedarf ohne Bezug auf den verfügbaren Lagerbestand definiert"
reconstruction:
  status: faithful
  svg: figures/reconstructed/abb-69.svg
  notes: >-
    Per Nebeneinander-Vergleich mit dem Original geprüft; Kästen, grau hinterlegte Kopfzeilen und
    die sechs Kreuzverbindungen positionsgetreu übernommen, Grautöne angenähert. Der Wurzelkasten
    „Materialbedarfsarten“ ist als Vorgabe kein Lösungselement. Die Abbildung definiert den
    Tertiärbedarf als „Betriebs- und Hilfsstoffe“, der Fließtext nur als Hilfsstoffe.
