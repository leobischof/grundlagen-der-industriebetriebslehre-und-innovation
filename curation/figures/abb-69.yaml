id: abb-69
title: Materialbedarf
type: hierarchie
description: >-
  Baumdiagramm mit Definitionskästen: Der dunkle Wurzelkasten „Materialbedarfsarten“ verzweigt in
  Primär-, Sekundär- und Tertiärbedarf, jeweils mit grau hinterlegter Überschrift und kurzer
  Definition. Darunter stehen die Kästen Bruttobedarf und Nettobedarf; dünne Linien verbinden
  jede der drei Bedarfsarten mit beiden Kästen (Brutto- und Nettobetrachtung gilt für jede
  Bedarfsart).
