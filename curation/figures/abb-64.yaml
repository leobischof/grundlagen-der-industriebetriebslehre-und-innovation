id: abb-64
title: Produktfeld Beispiel
type: hierarchie
description: >-
  Baumdiagramm am Beispiel „Schuhe“. Links stehen die Gliederungsebenen Produktbereich,
  Produktgruppe, Produkttyp und Varianten (die Varianten umfassen zwei Zeilen, durch eine Klammer
  zusammengefasst). Rechts der Baum: Schuhe → Sport, Männerschuhe, … ; Sport → Boots, Sneakers, … ;
  Boots → schwarz, braun, … ; schwarz → 35, 36, 37, … .
