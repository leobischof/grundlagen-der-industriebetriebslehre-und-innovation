meaning: >-
  Laut Skript (9.1.2) ermittelt die strategische Programmplanung Produktfelder, die das
  allgemeine Tätigkeitsfeld des Unternehmens kennzeichnen. Die taktische Programmplanung legt
  deren Besonderheiten fest: den Produktionsprogrammumfang (Produktgruppen, Arten und Varianten,
  z. B. Farbe, Qualität, Dimension) und die Produktionsprogrammtiefe (make-or-buy). Das Beispiel
  zeigt den Programmumfang für das Produktfeld „Schuhe“ von der Produktgruppe bis zur Variante
  nach Farbe und Größe.
