meaning: >-
  Laut Skript (1.2.1) spielt die Industrie auch bei der Wertschöpfung in Österreich eine große
  Rolle; die Tabelle ordnet Österreich international ein. Mit 21,8 % Industrieanteil liegt
  Österreich über dem EU-Schnitt (20,6 %) und der Eurozone (20,2 %), deutlich über
  dienstleistungsgeprägten Volkswirtschaften wie Frankreich, USA oder Vereinigtem Königreich,
  aber unter Deutschland (24,5 %). Der Fließtext nennt für die jüngere Vergangenheit einen
  Industriebeitrag von stets über 28 Prozent, was mit der Tabelle (21,8 % Industrie, 7,4 %
  Bauwesen) nur bei Einrechnung des Bauwesens zusammenpasst.
