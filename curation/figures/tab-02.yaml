id: tab-02
title: Prozentualer Anteil der Sektoren an der Gesamtwertschöpfung im Jahr 2023
type: tabelle
description: >-
  Tabelle mit fünf Spalten (Land, Land-/Forstwirtsch., Industrie, Bauwesen, Dienstleistungen) und
  24 Zeilen, alphabetisch nach Ländern bzw. Wirtschaftsräumen geordnet. Jede Zeile gibt die
  prozentualen Anteile der vier Sektoren an der Gesamtwertschöpfung 2023 an. Die Durchschnitte
  EU (27) und Eurozone (20) sind kursiv, Österreich ist fett hervorgehoben.
