id: abb-39
title: 5-Step Prozess des Design Thinking
type: prozess
description: >-
  Fünf nebeneinander stehende Spalten unter der Überschrift „Phasen“. Jede Spalte nennt Nummer und
  Phase (1 Entdeckung, 2 Interpretation, 3 Ideenfindung, 4 Experimente, 5 Evolution), ein
  Piktogramm und darunter eine fett gesetzte Ich-Aussage mit einer Leitfrage in Normalschrift.
