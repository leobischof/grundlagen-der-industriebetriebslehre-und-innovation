curves: []
meaning: >-
  Design Thinking (IDEO) ist eine systematische, nutzerzentrierte Herangehensweise an komplexe
  Probleme; Input und Feedback von Kunden und Anwendern bilden den Kern (sec-6.3). Die fünf Phasen:
  Entdeckung (Nutzer verstehen, Empathie gewinnen), Interpretation (gesammeltes Wissen analysieren
  und Anforderungen ableiten), Ideenfindung (vorbereitetes Brainstorming in interdisziplinärer
  Gruppe, z. B. mit „How might we…?“-Fragen), Experimentieren (Ideen als Prototypen umsetzen und
  Feedback einholen) und Evolution (Konzept weiterentwickeln, nächste Schritte planen,
  dokumentieren). Die Konzepte werden in mehreren Iterationszyklen verbessert.
exam_relevance:
