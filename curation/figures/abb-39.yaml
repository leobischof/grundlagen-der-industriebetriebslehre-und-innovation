    „Design-Thinking-Methode nach IDEO beschreiben und die fünf Phasen erklären“. Die Abbildung ist
    das Gerüst der Antwort.
  question_ids: [frage-2024-06-20-2, frage-2024-12-10-3, frage-2025-10-15-5]
drawing:
  difficulty: leicht
  must_know:
    - "Fünf Phasen in Reihenfolge: Entdeckung, Interpretation, Ideenfindung, Experimente, Evolution"
    - "Je Phase die Ich-Aussage und Leitfrage (Challenge → gelernt → Möglichkeit → Idee → neues probiert)"
    - "Nutzerzentrierung und Iteration als Kern der Methode"
  common_mistakes:
    - "Die fünf Phasen des Stanford-Modells (Empathize, Define, Ideate, Prototype, Test) statt der IDEO-Phasen nennen"
    - "Interpretation und Ideenfindung vertauschen"
reconstruction:
  status: faithful
  svg: figures/reconstructed/abb-39.svg
  notes: >-
    Per Nebeneinander-Vergleich mit dem Original geprüft; alle Texte im Originalwortlaut (inkl.
    Silbentrennung „inter-/pretiere“ und kleingeschriebenem „neues“). Die fünf Piktogramme
    (Kompass, Lupe, Glühbirne, Zahnrad, Kreislaufpfeile) sind nicht nachgebildet, sondern durch
    graue Kreise mit dem Namen des Symbols ersetzt. Im Bild heißt Phase 4 „Experimente“, im
    Skripttext „Experimentieren“, Phase 3 im Text „Ideen finden“.
