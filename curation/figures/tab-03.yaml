id: tab-03
title: Prozentualer Anteil der Sektoren an der Gesamtwertschöpfung im Jahr 2023
type: tabelle
description: >-
  Tabelle der österreichischen Unternehmen nach Größenklassen: Spalten Kleinstunternehmen (<10
  MA), Kleinunternehmen (<50 MA), Mittlere Unternehmen (<250 MA) und Große Unternehmen (>250 MA);
  Zeilen Anzahl, Beschäftigte, Lehrlinge und Umsätze, jeweils mit absolutem Wert und darunter dem
  Anteil in eckigen Klammern.
