  notes: >-
    Per Nebeneinander-Vergleich mit dem Original geprüft; alle Zellen mit Wortlaut, Zahlen und
    zweizeiligem Aufbau übernommen, uneinheitliche Leerzeichen vor dem Prozentzeichen („[21%]“
    neben „[29 %]“) wie im Original. Zahlen zusätzlich mit der Textschicht des PDFs abgeglichen.
    Die Beschriftung im Skript („Prozentualer Anteil der Sektoren an der Gesamtwertschöpfung im
    Jahr 2023“) ist wortgleich mit Tabelle 2 und passt nicht zum Inhalt (Unternehmen nach
    Größenklassen) – vermutlich ein Kopierfehler im Skript; der Titel ist unverändert übernommen.
