id: abb-31
title: Point-based Serial Engineering
type: prozess
description: >-
  Rahmen mit der Überschrift „Point-Based Serial Engineering“ und einer waagrechten Kette aus fünf
  grauen Kästchen „Prozess A“ bis „Prozess E“, die jeweils mit einem einfachen Pfeil nach rechts an
  den nächsten Prozess weitergeben. Es gibt keine Rückkopplung von hinten nach vorne.
