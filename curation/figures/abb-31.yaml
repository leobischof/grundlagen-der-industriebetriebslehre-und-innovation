curves: []
meaning: >-
  Laut Skript (sec-5.6) entwickelt ein punktbasierter serieller Ansatz in jeder Phase eine Lösung,
  die nur auf den Lösungen der früheren Phasen aufbaut. Nachgelagerte Prozesse haben keinen Einfluss
  auf vorgelagerte; falsche Entscheidungen können deshalb zu immensen Iterationsschleifen über
  mehrere Phasen führen. Die Abbildung ist der Ausgangspunkt für den Vergleich mit Point-based
  (Abbildung 32) und Set-based Concurrent Engineering (Abbildung 33).
exam_relevance:
  level: niedrig
  reason: >-
    In exams/topic-mapping.json keiner Prüfungsfrage zugeordnet. Abschnitt 5.6 wird zwar geprüft
    (Integrationsbereiche, Prinzipien des SE, Arten der Integration), die Point-based-/Set-based-
    Abbildungen selbst wurden bisher nicht abgefragt. Nützlich als Kontrast zu Concurrent Engineering.
  question_ids: []
drawing:
  difficulty: leicht
  must_know:
    - "Fünf Prozesse A bis E strikt hintereinander"
    - "Pfeile nur vorwärts, keine Rückkopplung"
  common_mistakes:
    - "Rückkopplungspfeile einzeichnen (das ist erst Point-based Concurrent Engineering)"
reconstruction:
