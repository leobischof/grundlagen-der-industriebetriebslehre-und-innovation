  svg: figures/reconstructed/abb-31.svg
  notes: >-
    Per Nebeneinander-Vergleich mit dem Original geprüft; Kastenpositionen, Grautöne und
    Pfeilstärken angenähert, die Rasterstruktur der grauen Kästchenfüllung im Scan ist als
    einfarbiges Hellgrau wiedergegeben. Die Überschrift im Rahmen ist als Vorgabe kein
    Lösungselement; Schreibweise „Point-Based“ (im Bild) gegenüber „Point-based“ (Bildtitel)
    unverändert übernommen.
