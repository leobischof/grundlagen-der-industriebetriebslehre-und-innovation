meaning: >-
  Die Integration in der Produktentstehung kann in vier Formen umgesetzt werden (Skript 5.6):
  menschliche Integration (Leistungsbereitschaft, Ziele, integratives Wissen), methodische
  Integration (Kunden, Aufgaben, Methoden wie DFM/DFA), organisatorische Integration (Aufbau-,
  Ablauf- und örtliche Integration, u. a. Simultaneous/Concurrent Engineering) und technologische
  Integration (Datenintegration über PDM/CAD-CAM, integrative Eigenschaftsfrüherkennung durch
  Simulation oder Rapid Prototyping).
