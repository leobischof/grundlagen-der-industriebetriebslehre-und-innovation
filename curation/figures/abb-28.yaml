id: abb-28
title: Arten der Integration
type: tabelle
description: >-
  Vierspaltige Tabelle unter dem Titelband „Elemente und Methoden der Integrierten
  Produkterstellung“. Spalten: „1. Mensch“ (1.1 Integration der Leistungsbereitschaft, 1.2
  Integration der Ziele, 1.3 Integratives Wissen), „2. Methodik“ (2.1 Integration der Kunden, 2.2
  Aufgabenintegration, 2.3 Methodenintegration), „3. Organisation“ (3.1 Aufbauintegration, 3.2
  Ablaufintegration, 3.3 örtliche Integration) und „4. Technik“ (4.1 Datenintegration, 4.2
  Integrative Eigenschafts-früherkennung). Unter jeder Unterart stehen Beispiele als
  Aufzählungspunkte.
