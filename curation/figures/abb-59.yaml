curves: []
meaning: >-
  Im Ressourcenmanagement (8.3.3) zielt Materialeffizienz darauf, mit möglichst wenig Material
  auszukommen und Verschwendung zu vermeiden. Die Hierarchie ordnet die Maßnahmen nach
  Wünschbarkeit: Am meisten zu fördern ist, von vornherein weniger Ressourcen zu verbrauchen und
  langlebige Produkte zu gestalten; danach folgen die Verlängerung der Lebensdauer durch
  Wiederverwendung, Reparatur und Aufarbeitung (noch Nutzungsphase). Erst am Lebensende
  (Abfallphase) kommen Recycling und energetische Rückgewinnung, und die Entsorgung auf der
  Mülldeponie ist zu vermeiden.
