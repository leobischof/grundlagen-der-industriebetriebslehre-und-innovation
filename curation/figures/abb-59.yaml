id: abb-59
title: Maßnahmenhierarchie für Materialeffizienz
type: hierarchie
description: >-
  Links ein senkrechter Keil mit Grauverlauf von „FÖRDERN“ (oben) nach „VERMEIDEN“ (unten).
  Rechts daneben vier geschweift geklammerte Gruppen mit nach rechts zeigenden Pfeilbalken, deren
  Länge von oben nach unten abnimmt: „Längere Produktlebensdauer mit weniger (Roh-) Materialien“
  (Weniger (natürliche) Ressourcen verbrauchen; Produkte so gestalten, dass sie länger halten),
  „Verlängerung der Lebensdauer von Produkten und Teilen“ (Wiederverwendung/ Reparatur/ Upgrade;
  Aufarbeitung/ Wiederaufbereitung), „Nützlicher Zweck für Materialien am Lebensende“ (Recyceln;
  Zurückgewinnen (z.B. Energie)) und „Mülldeponie“ (Entsorgen). Eine waagrechte Linie trennt die
  Nutzungsphasen (oben, Pfeil nach oben) von den Abfallphasen (unten, Pfeil nach unten). Unten
  rechts die Logos der UN-Nachhaltigkeitsziele und der IEC.
