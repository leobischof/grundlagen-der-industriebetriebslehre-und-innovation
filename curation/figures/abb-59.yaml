drawing:
  difficulty: mittel
  must_know:
    - "Rangfolge von oben (fördern) nach unten (vermeiden): weniger Ressourcen/langlebig gestalten → Wiederverwendung/Reparatur/Aufarbeitung → Recyceln/Zurückgewinnen → Entsorgen"
    - "Trennlinie zwischen Nutzungsphasen und Abfallphasen"
  common_mistakes:
    - "Recycling als beste Maßnahme eingeordnet, obwohl Vermeidung und Lebensdauerverlängerung vorrangig sind"
    - "Energetische Rückgewinnung mit stofflichem Recycling gleichgesetzt"
reconstruction:
  status: faithful
  svg: figures/reconstructed/abb-59.svg
  notes: >-
    Per Nebeneinander-Vergleich mit dem Original geprüft; alle Gruppen, Pfeilbalken (mit
    abnehmender Länge und angenäherten Grautönen), Klammern, Trennlinie und Phasenbeschriftungen
    sind im Originalwortlaut vorhanden. Der Farbverlauf des Keils ist mangels Verlaufselement aus
    schmalen Graustreifen zusammengesetzt; die feinen gepunkteten Hintergrundlinien sind
    weggelassen. Die Logos (UN-Nachhaltigkeitsziele, IEC) sind nicht nachgebildet, sondern nur als
    grauer Ring und Kasten mit „IEC“ angedeutet. Die Beschriftung des schwarzen Balkens ist im Scan
    kaum lesbar und als „Entsorgen“ gelesen.
