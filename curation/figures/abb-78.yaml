    der Produktionssteuerung (Abschnitt 9.2).
  question_ids: []
drawing:
  difficulty: mittel
  must_know:
    - "Materialfluss: Input → Material supply → Produktionsprozess (Fertigung und Montage) → Messung → Output"
    - "Rückkopplung: Messung → Überwachung (Soll-/Ist-Vergleich)"
    - "Zwei Reaktionen: Plan anpassen (Überwachung → Planen) oder in die Produktion eingreifen (Überwachung → Materialversorgung)"
    - "Planen gibt die Zielproduktionsmenge an die Überwachung"
    - "Störgrößen: Materialfehler, Ausfall der Maschine"
  common_mistakes:
    - "Regelkreis nicht geschlossen (Messung der Ist-Menge vergessen)"
    - "Nur eine der beiden Reaktionen (Eingriff oder Planänderung) gezeigt"
