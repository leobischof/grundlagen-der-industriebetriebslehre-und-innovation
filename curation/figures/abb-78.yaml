id: abb-78
title: Produktionsregelkreis
type: system
description: >-
  Regelkreis der Produktion: Unten läuft der Materialfluss von links nach rechts, vom „Input“
  (Einzelteile) über einen Kreis „Material supply“ in den Kasten „Fertigung und Montage“ mit dem
  dunklen Pfeil „Produktionsprozess“ „(Ausführung)“, dann über ein Messkästchen („Messung der
  tatsächlichen Produktionsmenge Output“) zum „Output“. Oben stehen die Kästen „Planen“ und
  „Überwachung der Abweichungen zwischen Ist- und Soll-Produktionsmengen“, die über zwei
  Rückkopplungspfeile verbunden sind. Die Messung meldet an die Überwachung zurück; von der
  Überwachung führen zwei Pfeile zur Materialversorgung. Unter der Fertigung stehen als Störungen
  „Materialfehler“ und „Ausfall der Maschine“ neben einem Warndreieck.
