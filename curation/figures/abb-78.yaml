curves: []
meaning: >-
  Laut Skript (9.2) bedeutet das Sichern der Aufgabenausführung, zu reagieren: (1) durch
  Interferieren, also Anpassen des tatsächlichen Zustands an den Zielzustand (Eingriff in die
  Materialversorgung bzw. Produktion), und (2) durch Anpassen des Plans, also Aktualisieren des
  Zielzustands mit tatsächlichen Informationen. Zusammen mit der Messung der Ist-Menge und dem
  Soll-/Ist-Vergleich ergibt sich ein geschlossener Regelkreis, der Störungen wie Materialfehler
  oder Maschinenausfälle ausregelt.
exam_relevance:
