  svg: figures/reconstructed/abb-53.svg
  notes: >-
    Per Nebeneinander-Vergleich mit dem Original geprüft; alle acht Faktoren, die Mitte und die
    acht Pfeile mit ihrer Richtung (jeweils auf die Realplanung) sind vorhanden. Die kleinen
    Piktogramme des Originals (Lageplan, Hang, Fixpunkte, Maschinen, Prozesskette, Organigramm)
    sind durch einfache, frei gezeichnete Grauflächen-Symbole ersetzt; § und € sind als Zeichen
    übernommen. Positionen angenähert.
