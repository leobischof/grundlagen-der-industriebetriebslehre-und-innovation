id: abb-53
title: Einschränkungen Realplanung
type: system
description: >-
  Sternförmiges Schema: In der Mitte die graue Ellipse „Realplanung“. Rundherum acht weiße
  Ellipsen mit je einem Einflussfaktor und einem kleinen Symbol, von denen jeweils ein schwarzer
  Pfeil auf die Realplanung zeigt: Grundstück (oben), Gelände, Fixpunkte, Betriebsmittel,
  Organisation (unten), GMP, Monetäre Ressourcen (Symbol €) und Rechtliche Bedingungen (Symbol §).
