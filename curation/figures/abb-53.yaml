curves: []
meaning: >-
  In der Layoutplanung (8.2.5.3) wird nach der Idealplanung, die Restriktionen bewusst ausblendet,
  in der Realplanung das Ideallayout unter Berücksichtigung existierender Restriktionen in
  realisierbare Reallayout-Varianten übergeführt; Ziel ist ein Gesamtoptimum zwischen Zielsetzung
  und Einschränkungen. Die Abbildung zeigt die Einflussfaktoren (Einschränkungen und
  Randbedingungen), die frühzeitig erkannt und spezifiziert werden müssen, um Planungsfehler zu
  vermeiden. GMP (Good Manufacturing Practice) bezeichnet Richtlinien zur Qualitätssicherung in der
  Produktion, die häufig Anpassungen im Layout erfordern.
exam_relevance:
  level: mittel
  reason: >-
    Laut exams/topic-mapping.json einmal zugeordnet (2024-06-20, Planungsvorgehen mit Layoutplanung
    sowie Ideal- und Realplanung erklären); die Einschränkungen der Realplanung sind dort ein
    Teilaspekt, die Zuordnung der Frage ist laut Fragenkatalog unsicher.
  question_ids: [frage-2024-06-20-3]
drawing:
  difficulty: leicht
  must_know:
    - "Realplanung in der Mitte, alle Pfeile zeigen auf sie"
    - "Acht Einschränkungen: Grundstück, Gelände, Fixpunkte, Betriebsmittel, Organisation, GMP, Monetäre Ressourcen, Rechtliche Bedingungen"
  common_mistakes:
