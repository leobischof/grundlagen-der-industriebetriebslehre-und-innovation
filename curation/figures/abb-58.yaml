curves: []
meaning: >-
  Laut Skript (8.3.3) folgert der Weltklimarat (IPCC) für den Industriesektor, dass mittelfristig
  emissionsarme bzw. -freie Energie (Konsistenz) und Energieeffizienz den größten Beitrag zur
  Dekarbonisierung leisten, langfristig vor allem Materialeffizienz sowie die Abscheidung und
  Nutzung von CO2 (CCUS). Das Ziel, 2050 keine Treibhausgasemissionen mehr auszustoßen, ist nur
  durch die Entwicklung und Einführung innovativer Technologien erreichbar.
