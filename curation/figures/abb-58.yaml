id: abb-58
title: Möglichkeiten der Industrie zur Dekarbonisierung
type: tabelle
description: >-
  Zweispaltige Tabelle mit dunkler Kopfzeile: links „Kurz- und mittelfristige Maßnahmen“, rechts
  „Mittel- bis langfristige Maßnahmen“. Sieben Zeilen stellen jeweils eine kurz- bis mittelfristige
  Maßnahme ihrem weitergehenden, langfristigen Gegenstück gegenüber: Ökostrom → komplett
  emissionsfreie Energie, Energieeffizienz durch BAT → Effizienz nahe am thermodynamischen Minimum,
  Brennstoffumstellung → CO2-arme Elektrifizierung und grüner Wasserstoff, Substitution
  CO2-intensiver Materialien → emissionsfreies Ausgangsmaterial, sektorale → großflächige
  CO2-Abscheidung (CCUS), Materialeffizienz und Substitution → Ökodesign und Bedarfsreduzierung,
  Recyclingquoten → Abfallwirtschaft mit Materialkreisläufen.
