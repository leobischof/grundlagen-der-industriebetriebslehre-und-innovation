meaning: >-
  Laut Skript (1.3.3) beschreibt der demografische Wandel eine grundlegende Änderung der
  Altersstruktur, in Österreich vor allem durch steigende Lebenserwartung und niedrige Geburtenrate.
  Die Abbildung zeigt das: Die stärksten Jahrgänge (Baby-Boom der 1960er) stehen kurz vor der
  Pension, die nachfolgenden Jahrgänge sind schwächer besetzt. Für Industriebetriebe heißt das: Der
  Anteil älterer Erwerbstätiger steigt deutlich, jüngere Mitarbeiter werden schwerer zu gewinnen.
  2024 lag das Durchschnittsalter bei 43,4 Jahren (über 61 % im erwerbsfähigen Alter), für 2050
  sind 46,7 Jahre und etwa 54 % prognostiziert. Folgen laut Skript: Arbeits- und
  Arbeitsplatzgestaltung für ältere Beschäftigte anpassen, das Erwerbspotenzial (Frauen, Ältere,
  Personen mit Migrationshintergrund) stärker nutzen, lebenslanges Lernen fördern und die alternde
  Belegschaft technisch unterstützen.
exam_relevance:
  level: niedrig
  reason: >-
    In exams/topic-mapping.json ist der Abbildung keine Prüfungsfrage zugeordnet. Prüfbar ist
    allenfalls die Aussage zum demografischen Wandel (alternde Belegschaft, schwächere junge
    Jahrgänge) und deren Folgen für Industriebetriebe; die Einzelwerte der Pyramide nicht.
  question_ids: []
drawing:
  difficulty: mittel
  must_know:
    - "Aufbau: Männer links, Frauen rechts, Lebensjahre senkrecht (jung unten), Personenzahl waagrecht von der Mitte nach außen"
    - "Form „Pilz/Urne“ statt Pyramide: breiteste Stelle bei den Baby-Boomern (Jahrgänge 1960er, heute rund 50–60 Jahre), darunter schmaler"
    - "Frauen im hohen Alter deutlich zahlreicher als Männer"
  common_mistakes:
    - "Klassische Pyramide mit breiter Basis gezeichnet (gilt für wachsende, nicht für alternde Bevölkerung)"
    - "Geburtsjahrgang und Lebensjahre verwechselt (Jahrgang 1960 = 60 Lebensjahre im Jahr 2020/2021)"
reconstruction:
  status: faithful
  svg: figures/reconstructed/abb-04.svg
  notes: >-
    Per Nebeneinander-Vergleich mit dem Original geprüft; Achsen mit Teilstrichen, alle
    Beschriftungen, Legende, die fünf Markierungen a–e mit Doppelpfeilen und ihre Erläuterungen
    stimmen überein. Die 101 Balken je Seite sind nicht nachgezeichnet, sondern aus einer
    vergrößerten Rasteransicht des Originals auf etwa ±1.000 Personen abgelesen und zwischen den
    abgelesenen Lebensjahren linear interpoliert; Umriss, Einschnitte und der dunkle
    Nicht-Österreich-Anteil entsprechen dem Original, einzelne Jahrgänge können um eine
    Balkenbreite abweichen. Schrift Arial statt der geometrischen Schrift des Originals.
    Doppelpfeile als Polygone.
