id: abb-04
title: Alterspyramide Österreichs (Stand 2021)
type: sonstiges
description: >-
  Bevölkerungspyramide als doppeltes horizontales Balkendiagramm: links Männer, rechts Frauen, je
  ein Balken pro Lebensjahr (0 bis 100+, unten jung, oben alt). Die linke Skala nennt den
  Geburtsjahrgang (2020 unten bis 1920 oben), die Mittelskala die Lebensjahre, die untere Skala die
  Personenzahl (0 bis 80.000 je Seite). Jeder Balken ist geteilt in einen dunklen inneren Teil
  (Nicht-Österreich) und einen hellen äußeren Teil (Österreich). Die Form ist keine Pyramide,
  sondern ein „Pilz“: am breitesten bei den 50- bis 60-Jährigen (Jahrgänge um 1960–1970, bis rund
  72.000 Personen je Geschlecht), schmaler bei den Jüngeren (rund 42.000–46.000 je Jahrgang) und
  nach oben stark abnehmend, bei den Frauen im hohen Alter deutlich breiter als bei den Männern.
  Fünf Markierungen a–e mit Erläuterungen rechts heben Einschnitte und Ausbuchtungen hervor.
