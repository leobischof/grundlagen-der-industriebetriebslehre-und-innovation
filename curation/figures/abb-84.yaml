id: abb-84
title: Dimensionen der Produktqualität
type: system
description: >-
  Sterndiagramm: Ein hellgrauer Kreis „Produktqualität“ in der Mitte, von dem acht Pfeile
  strahlenförmig zu den acht Qualitätsdimensionen zeigen, jeweils deutscher Begriff fett und
  englischer Begriff in Klammern darunter. Im Uhrzeigersinn von oben: Leistung (Performance),
  Ausstattung (Features), Zuverlässigkeit (Reliability), Konformität (Conformance), Beständigkeit
  (Durability), Wartungsfähig (Serviceability), Ästhetik (Aesthetics), Qualitätsimage (Perceived
  Quality).
