curves: []
meaning: >-
  Aus Kundensicht lässt sich Produktqualität nach Garvin in acht Dimensionen beschreiben (Skript
  9.3.1): Leistung (Umfang und Funktionalität), Ausstattung (sekundär zur Leistung, z. B.
  Ledersitze), Zuverlässigkeit (Ausfallwahrscheinlichkeit in einer Zeitspanne), Konformität
  (Übereinstimmung mit Anforderungen/Standards), Beständigkeit (Produktlebensdauer),
  Wartungsfähigkeit (Reparierbarkeit, Servicepersonal), Ästhetik (äußeres Erscheinungsbild,
  Geschmack, Geruch) und Qualitätsimage (tatsächlich wahrgenommene Qualität, z. B. Marken-Image).
  Unternehmen können sich auf unterschiedliche Dimensionen konzentrieren, um Wettbewerbsvorteile
  zu erzielen, und müssen die vom Kunden geforderte Qualität verstehen.
exam_relevance:
  level: mittel
  reason: >-
    In exams/topic-mapping.json ist der Abbildung keine Frage zugeordnet. Die bisherigen Fragen zu
    9.3.1 betreffen Ziele und Methoden des Qualitätsmanagements, nicht die Dimensionen; eine
    Aufzählfrage „Dimensionen der Produktqualität“ ist aber naheliegend.
  question_ids: []
drawing:
  difficulty: mittel
  must_know:
    - "Acht Dimensionen um den Kreis „Produktqualität“"
    - "Deutsche und englische Begriffe paarweise (Leistung/Performance … Qualitätsimage/Perceived Quality)"
  common_mistakes:
    - "Zuverlässigkeit (Ausfallwahrscheinlichkeit) und Beständigkeit (Lebensdauer) verwechselt"
    - "Leistung und Ausstattung zu einer Dimension zusammengefasst"
    - "Qualitätsimage vergessen"
reconstruction:
  status: faithful
  svg: figures/reconstructed/abb-84.svg
  notes: >-
    Per Nebeneinander-Vergleich mit dem Original geprüft; Kreis, Pfeilwinkel und
    Beschriftungspositionen angenähert, nichts vereinfacht. Wortlaut „Wartungsfähig“ unverändert
    aus der Abbildung übernommen (Fließtext: „Wartungsfähigkeit“). Der Kreis „Produktqualität“ ist
    als vorgegebener Mittelpunkt kein Lösungselement, alle acht Dimensionen sind class="answer".
