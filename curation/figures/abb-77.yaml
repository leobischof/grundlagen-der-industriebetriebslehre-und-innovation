reconstruction:
  status: faithful
  svg: figures/reconstructed/abb-77.svg
  notes: >-
    Per Nebeneinander-Vergleich mit dem Original geprüft; alle 13 Aufgabenkästchen, drei Funktionen,
    Wurzel und beide Phasenbeschriftungen vollständig und im Originalwortlaut. Die sehr blassen
    Verbindungslinien und die schwache Trennlinie zwischen den Phasen sind als hellgraue Linien
    angenähert; Positionen und Grautöne angenähert, Schrift Arial. Der Wurzelkasten ist als Vorgabe
    kein Lösungselement.
