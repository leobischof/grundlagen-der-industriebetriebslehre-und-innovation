  reason: >-
    In exams/topic-mapping.json keiner Prüfungsfrage zugeordnet. Als Gliederung der
    Produktionssteuerung (veranlassen, überwachen, sichern) dennoch nützliches Hintergrundwissen
    für Fragen zu Abschnitt 9.2.
