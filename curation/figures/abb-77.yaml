id: abb-77
title: Produktionssteuerung
type: hierarchie
description: >-
  Baumdiagramm von links nach rechts: Der Wurzelkasten „Produktionssteuerung“ verzweigt in die drei
  Funktionen „Produktion veranlassen“, „Produktion überwachen“ und „Produktion sichern“. Jeder
  Funktion sind rechts Einzelaufgaben als Kästchen zugeordnet (7, 3 und 3). Am rechten Rand
  ordnen zwei senkrechte Beschriftungen die Aufgaben den Phasen „Auftragsvorbereitung“ (die ersten
  fünf Aufgaben) und „Werkstattsteuerung“ (alle übrigen) zu.
