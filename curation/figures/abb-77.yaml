meaning: >-
  Laut Skript (9.2) liegt der Schwerpunkt der Steuerung auf dem kurzfristigen Horizont. Ziel ist es,
  die Produktion (1) zu veranlassen, (2) zu überwachen (Ist-Situation) und (3) die
  Aufgabenausführung hinsichtlich Menge, Termine, Qualität, Kosten und Arbeitsbedingungen zu
  sichern. Das Veranlassen reicht von der Auftragsvorbereitung (Programm, Bedarf, Beschaffung,
  Termine, Unterlagen) bis in die Werkstattsteuerung (Bereitstellung, Arbeitsverteilung);
  Überwachen und Sichern gehören zur Werkstattsteuerung.
exam_relevance:
