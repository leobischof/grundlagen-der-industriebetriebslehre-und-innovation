curves: []
meaning: >-
  Eversheim/Schuh/Assmus (2005) gliedern die Rahmenstruktur der integrierten Produkt- und
  Prozessgestaltung in drei Hauptbereiche (sec-5.6): Organisations- und Informationsmanagement als
  Basis (Projekt-, Risiko- und Informationsmanagement), integrierte Produktdefinition und
  Technologieplanung (Markt-/Kundenbedürfnisse mit technologischen Innovationen zusammenführen) und
  integrierte Produkt- und Produktionsprozessgestaltung (frühe Abstimmung von Produkt und
  Produktionsprozess, weil die Produktionskosten früh festgelegt werden). Der Fokus liegt auf den
  frühen Phasen bis zur Produktionsplanung.
exam_relevance:
  level: niedrig
  reason: >-
    In exams/topic-mapping.json keiner Prüfungsfrage zugeordnet. Die drei Hauptbereiche eignen sich
    als Aufzählungsfrage, wurden bisher aber nicht abgefragt.
  question_ids: []
drawing:
  difficulty: schwer
  must_know:
    - "Drei Hauptbereiche: Organisations- und Informationsmanagement (Basis), integrierte Produktdefinition und Technologieplanung, integrierte Produkt- und Produktionsprozessgestaltung"
    - "Zwei Bahnen: Markt → Produktgestaltung, Technologie → Produktionsprozessgestaltung"
  common_mistakes:
    - "Organisations- und Informationsmanagement als gleichrangige Säule statt als Basis darstellen"
    - "Markt und Technologie den falschen Bahnen zuordnen"
reconstruction:
  status: faithful
  svg: figures/reconstructed/abb-34.svg
  notes: >-
    Per Nebeneinander-Vergleich mit dem Original geprüft; die 3D-Grafik ist als vereinfachte
    Schrägprojektion aus flachen Polygonen nachgebaut (Quader, Pfeilspitzen und dunkle Rauten an den
    Bahnenden angenähert, ohne Schattierungsverläufe). Alle Beschriftungen, die drei Callouts mit
    gepunkteten Führungslinien und die Zuordnung der Blöcke stimmen mit dem Original überein; die
    gepunkteten Linien sind als Reihen kleiner Quadrate gezeichnet.
