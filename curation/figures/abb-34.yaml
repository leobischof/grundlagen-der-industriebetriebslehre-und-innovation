id: abb-34
title: Rahmenstruktur-Konzept für integrierte Produkt- und Prozessgestaltung nach EVERSHEIM/SCHUH/ASSMUS
type: system
description: >-
  Dreidimensionales Bild eines gläsernen Kastens auf einer Bodenplatte. Die Bodenplatte steht für
  das „Organisations- und Informationsmanagement“ als Basis. Darauf liegen zwei hellgraue,
  pfeilförmige Bahnen nach rechts: vorne „Produktgestaltung“ (beginnend beim Block „Markt“),
  hinten „Produktionsprozessgestaltung“ (beginnend beim Block „Technologie“). Ein dunkler
  Querbalken verbindet Technologie mit der Markt-/Produktseite (Callout „Integrierte
  Produktdefinition und Technologieplanung“); eine große dunkle Platte überdeckt beide Bahnen
  (Callout „Integrierte Produkt- und Produktionsprozessgestaltung“).
