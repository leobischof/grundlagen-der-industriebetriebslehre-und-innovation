meaning: >-
  Laut Skript (9.1.1) soll die Absatzplanung Erkenntnisse über die zukünftige Entwicklung der
  verkauften Produkte liefern. Sie liegt meist in der Verantwortung von Marketing oder Verkauf,
  ist aber ein entscheidender Input für operative Entscheidungen. Ihr Ergebnis ist die Grundlage
  für die Produktionsprogrammfestlegung, Material- und Personalentscheidungen sowie die Zeit-,
  Kapazitäts- und Allokationsplanung. Die Abbildung heißt „Absatzplanung“, der Prozesskasten
  „Verkaufsplanung“ – beide Begriffe werden im Skript synonym verwendet.
