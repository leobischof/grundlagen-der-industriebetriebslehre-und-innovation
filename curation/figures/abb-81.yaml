id: abb-81
title: Dilemma der Ablaufplanung am Bsp. der Erhöhung der Kapazitätsauslastung
type: sonstiges
description: >-
  Zwei Netz- bzw. Rautendiagramme nebeneinander mit je vier Achsen, die vom Mittelpunkt ausgehen:
  oben „Kurze Durchlaufzeit“, rechts „Hohe Kapazitätsauslastung“, unten „Hohe Termintreue“, links
  „Niedrige Bestände“. Links eine grau gefüllte, symmetrische Raute mit schwarzen Punkten als
  Ausgangszustand. Rechts dieselbe Raute als Umriss und zusätzlich eine gestrichelte Raute mit
  grauen Punkten: Die Kapazitätsauslastung reicht weiter nach außen, die drei übrigen Zielgrößen
  rücken zur Mitte (schlechter).
axes:
  - {axis: oben, label: Kurze Durchlaufzeit, unit: null, direction: oben}
  - {axis: rechts, label: Hohe Kapazitätsauslastung, unit: null, direction: rechts}
  - {axis: unten, label: Hohe Termintreue, unit: null, direction: unten}
  - {axis: links, label: Niedrige Bestände, unit: null, direction: links}
elements:
