curves: []
meaning: >-
  Hybride Lager- und Kundeneinzelfertigung (Skript 9.3.2, Geschwindigkeit): Die Wertschöpfungskette
  wird an einem Entkopplungspunkt, der ein Lager darstellt, getrennt. Davor werden Halbzeuge auf
  Lager gefertigt, danach kundenauftragsbezogen. Je weiter der Entkopplungspunkt zum Kunden rückt,
  desto kürzer die Auftragserfüllungszeit (lead-time), aber desto höher Lagerkosten und
  Altbestandsrisiko; je weiter er zum Rohmaterial rückt, desto mehr Varianten sind möglich und
  desto länger wartet der Kunde. Ein Halbfertigteillager senkt die Bestandskosten gegenüber einem
  Fertigteillager und erlaubt trotzdem hohe Variantenvielfalt.
exam_relevance:
  level: mittel
  reason: >-
    In exams/topic-mapping.json ist der Abbildung keine Frage zugeordnet. Das Konzept
    Entkopplungspunkt bzw. Make-to-stock gegen Make-to-order ist jedoch zentraler Stoff zur
    Geschwindigkeit und gut als Zeichenaufgabe geeignet.
  question_ids: []
drawing:
  difficulty: mittel
  must_know:
    - "Stufen Rohmaterial – Fertigung/Montage – Vertrieb – Kunde als Spalten"
    - "Fünf Strategien in Reihenfolge: Buy-, Make-, Assembly-to-order, Make-to-stock, Ship-to-stock"
    - "Hell = Lagerfertigung vor dem Entkopplungspunkt, dunkel = Kundeneinzelfertigung danach"
    - "Dreieck als Entkopplungspunkt (Lager)"
  common_mistakes:
    - "Hell und dunkel vertauscht (Lagerfertigung liegt immer kundenfern, also links)"
    - "Make-to-stock und Assembly-to-order in der Reihenfolge vertauscht"
    - "Ship-to-stock vergessen"
