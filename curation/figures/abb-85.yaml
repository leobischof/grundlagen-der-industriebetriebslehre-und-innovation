id: abb-85
title: Entkopplungspunkte
type: prozess
description: >-
  Fünf waagrechte Balken entlang der Wertschöpfungskette Rohmaterial, Fertigung/Montage, Vertrieb,
  Kunde (Spaltenköpfe mit dünnen senkrechten Hilfslinien). Jeder Balken ist links hell
  (Lagerfertigung) und rechts dunkel (Kundeneinzelfertigung); an der Grenze sitzt ein nach unten
  zeigendes Dreieck als Entkopplungspunkt. Von oben nach unten wandert der Entkopplungspunkt
  Richtung Kunde: Kaufen auf Bestellung „Buy-to-order“, Einzelfertigung „Make-to-order“, Montage
  auf Bestellung „Assembly-to-order“, Lagerfertigung „Make-to-stock“, Lieferung an Lager
  „Ship-to-stock“. Unten eine Legende für Dreieck, hellen und dunklen Balken.
