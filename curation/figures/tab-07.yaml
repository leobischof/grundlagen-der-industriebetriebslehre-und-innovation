id: tab-07
title: Arten der Flexibilität
type: tabelle
description: >-
  Tabelle mit drei Spalten (Art der Flexibilität ohne Kopf, „Umfang“, „Reaktion“) und vier Zeilen
  für Produkt-, Misch-, Volumen- und Lieferflexibilität. Je Art wird beschrieben, wie groß die
  mögliche Veränderung ist (Umfang) und wie lange die Änderung dauert (Reaktion).
axes: []
elements:
  - {id: h1, kind: spaltenkopf, text: Umfang}
  - {id: h2, kind: spaltenkopf, text: Reaktion}
  - {id: r1, kind: zeilenkopf, text: Produktflexibilität, note: "im Original getrennt „Produkt-/flexibilität“"}
  - {id: r1u, kind: zelle, text: "Die Produktpalette, die das Unternehmen herstellen kann."}
  - {id: r1r, kind: zelle, text: "Die Zeit, in der das Produkt entwickelt wird, bis das neue Produkt produziert werden kann (time-to-market)."}
  - {id: r2, kind: zeilenkopf, text: Mischflexibilität, note: "im Original getrennt „Mischfle-/xibilität“"}
  - {id: r2u, kind: zelle, text: "Die Produktpalette, die ein Unternehmen innerhalb eines bestimmten Zeitraums liefern kann."}
  - {id: r2r, kind: zelle, text: "Die Zeit, um den Mix der gelieferten Produkte anzupassen."}
  - {id: r3, kind: zeilenkopf, text: Volumenflexibilität, note: "im Original getrennt „Volumen-/flexibilität“"}
  - {id: r3u, kind: zelle, text: "Die Höchstmenge, die ein Unternehmen für einen bestimmten Produktmix liefern kann."}
  - {id: r3r, kind: zelle, text: "Die Zeit zum Ändern dieser Höchstmenge"}
  - {id: r4, kind: zeilenkopf, text: Lieferflexibilität, note: "im Original getrennt „Lieferflexi-/bilität“"}
  - {id: r4u, kind: zelle, text: "Der Umfang, in dem Liefertermine geändert werden können."}
  - {id: r4r, kind: zelle, text: "Die Zeit, um das Liefersystem für einen neuen Termin zu reorganisieren"}
