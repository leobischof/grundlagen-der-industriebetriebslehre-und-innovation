curves: []
meaning: >-
  Flexibilität ist die Fähigkeit, auf veränderte Kundenbedürfnisse zu reagieren (Skript 9.3.4).
  Die Arten werden nach der Höhe der Veränderung (Umfang) und der benötigten Zeit für die Änderung
  (Reaktion) kategorisiert: Produktflexibilität (schnell mit neuen Produkten reagieren),
  Mischflexibilität (breite Palette an Produkten/Varianten anbieten), Volumenflexibilität (Output
  bei schwankender, auch saisonaler Nachfrage erhöhen oder verringern) und Lieferflexibilität (auf
  geänderte Liefertermine reagieren, Prioritäten umstellen und trotzdem pünktlich liefern).
  Flexibilität wird an der Reaktion eines bestehenden Produktionssystems gemessen; Agilität geht
  darüber hinaus (proaktiv, ganze Wertschöpfungskette, Fokus Profitabilität).
