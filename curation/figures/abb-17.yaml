meaning: >-
  Die Abbildung gibt laut Skript (3.2) eine Übersicht über die allgemeinen Elemente des
  Produktionsprozesses: Mit dem Produktionsprozess (Fertigung, Montage unter
  Produktionsplanung und -kontrolle) ist die innerbetriebliche Logistik verbunden, die die
  Materialverfügbarkeit über Transport-, Umschlag- und Lagertätigkeiten sichert. Beschaffung und
  Vertrieb verbinden die Produktion mit Lieferanten und Absatzmarkt; Informationen fließen
  sowohl mit als auch gegen den Materialfluss.
