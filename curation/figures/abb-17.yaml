id: abb-17
title: Elemente des Produktionsprozesses
type: prozess
description: >-
  Wertschöpfungskette als Reihe von Pfeilkästen zwischen den dunklen Randkästen „Lieferanten“
  (links) und „Absatzmarkt“ (rechts): Einkauf, Rohmateriallager, Fertigung, Montage,
  Fertigteillager, Vertrieb. Fertigung und Montage liegen in einer dunklen Ellipse mit
  „PRODUKTIONSPLANUNG“ oben und „PRODUKTIONSKONTROLLE“ unten. Oben verläuft der
  Informationsfluss gegen den Materialfluss (durchgezogen, vom Absatzmarkt zu den Lieferanten),
  unten der Informationsfluss mit dem Materialfluss (gepunktet). Darunter drei Logistikbalken:
  Beschaffungslogistik, Produktionslogistik/Linienbeschickung, Vertriebslogistik.
