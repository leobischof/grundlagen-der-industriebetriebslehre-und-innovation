meaning: >-
  Gegenüberstellung von nicht integrierter und integrierter Produktentstehung (Skript 5.6): Oben
  arbeiten die Abteilungen getrennt und reichen Ergebnisse sequenziell „über die Mauer“ weiter.
  Unten arbeiten alle Beteiligten – einschließlich Kunde und Zulieferer – in einem Raum zusammen.
  Integration bedeutet die Kombination der Teilbereiche zu einem Ganzen mit enger Zusammenarbeit,
  gemeinsamen Zielen hinsichtlich Qualität, Zeit und Kosten und parallelisierten Abläufen.
