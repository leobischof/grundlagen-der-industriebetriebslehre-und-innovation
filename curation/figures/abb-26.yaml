id: abb-26
title: Integrierte Produktentstehung 2013
type: sonstiges
description: >-
  Zwei Bildszenen untereinander. Oben: ein in Räume abgeteiltes Gebäude mit den Abteilungen
  „Verkauf“, „Konstruktion“, „Produktions-vorbereitung“, „Produktion“ und darüber
  „Materialwirtschaft“; je eine Person pro Raum, die Arbeit wird mit Pfeilen über die Wände von
  Abteilung zu Abteilung weitergereicht. Unten: ein einziger gemeinsamer Raum, in dem Kunde,
  Zulieferer, Konstruktion, Verkauf, Abfallwirtschaft, Materialwirtschaft, Controlling, Produktion
  und Produktions-vorbereitung als Gruppe zusammenstehen; darunter „Better Together“.
