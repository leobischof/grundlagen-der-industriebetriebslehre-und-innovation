meaning: >-
  Ein Arbeitssystem dient laut Skript der Erfüllung von Arbeitsaufgaben: Mensch und Betriebsmittel
  wirken mit der Eingabe unter Umwelteinflüssen zusammen. Die Arbeitsaufgabe ist der Zweck des
  Systems (abgeleitet aus dem Unternehmensziel), der Arbeitsablauf bzw. Prozess beschreibt das
  räumliche und zeitliche Zusammenwirken. Eingabe sind Arbeitsgegenstände, Menschen, Informationen
  und Energie; die Ausgabe ist das veränderte Ergebnis. Mensch und Betriebsmittel bilden die
  Kapazitäten. Umwelteinflüsse sind physikalisch (Umgebungseinflüsse wie Klima, Lärm, Licht),
  organisatorisch und sozial. Aus Ein- und Ausgabe lassen sich Kenngrößen wie Produktivität und
  Wirtschaftlichkeit ableiten.
