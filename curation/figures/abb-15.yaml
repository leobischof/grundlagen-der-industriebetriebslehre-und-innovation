id: abb-15
title: Industriebetrieb als Arbeitssystem
type: system
description: >-
  Arbeitssystem nach REFA: Eine gestrichelte große Ellipse bildet die Systemgrenze, darin liegt
  eine kleinere durchgezogene Ellipse mit den Kreisen Mensch und Betriebsmittel, die über
  Prozesspfeile verbunden sind (Prozess, Arbeitsablauf). Ein Blockpfeil Eingabe führt von links
  hinein, ein Blockpfeil Ausgabe nach rechts hinaus. Von oben wirken Unternehmensziel und
  Arbeitsaufgabe über Pfeile auf das System, ein Doppelpfeil zeigt die Umwelteinflüsse.
