id: abb-60
title: Produktionsprogrammplanung
type: prozess
description: >-
  Prozessdiagramm des Produktionsplanungsprozesses. Oben ein großer Pfeil „Prozess der
  Produktionsplanung“ mit fünf aufeinanderfolgenden, von hell nach dunkel eingefärbten
  Chevrons: Planung des Produktionsprogramms, Materialbedarfsplanung, Zeit- und
  Kapazitätsplanung, Realisierung der Produktion, Produktionskontrolle. Darunter der Kasten
  „Produktionsprogramm“ sowie zwei weitere Pfeile „Produktion“ (Herstellung, Assembly) und
  „Beschaffung“ (Materialnachfrage, Verwaltung des Inventars, Bestellung). Senkrechte Linien und
  Pfeile verbinden die Planungsschritte mit Produktion und Beschaffung; ein „Auftrag“ geht von der
  Realisierung in die Produktion, die Produktionskontrolle meldet an die ersten drei
  Planungsschritte zurück.
