meaning: >-
  Laut Skript (9.1) umfasst der Produktionsplanungsprozess die Produktionsprogrammplanung
  (Produktionsmengen für den Planungszeitraum aus der Absatzplanung), die Mengenplanung für
  Beschaffung und Produktion (Materialbedarfsplanung) und die Termin- und Kapazitätsplanung.
  Gesamtziel ist die Minimierung der Produktionskosten pro Einheit. Die Abbildung ordnet diese
  Planungsschritte vor Realisierung und Kontrolle an und zeigt, dass sie mit Produktion und
  Beschaffung in beide Richtungen verknüpft sind. Die Aufgaben des Operations Management sind
  Absatzplanung, kurzfristige Produktionsprogrammplanung, Materialbedarfsplanung, Zeit- und
  Kapazitätsplanung sowie Steuerung und Kontrolle der Produktion.
exam_relevance:
  level: mittel
  reason: >-
    In exams/topic-mapping.json keiner Prüfungsfrage zugeordnet. Die Abbildung ist aber das
    Gerüst des Abschnitts 9.1; die Reihenfolge der Planungsschritte ist Grundlage für die
    abgefragten Detailthemen (Materialbedarf, ABC-Analyse, GAE).
  question_ids: []
drawing:
  difficulty: mittel
  must_know:
    - "Fünf Schritte in Reihenfolge: Planung des Produktionsprogramms → Materialbedarfsplanung → Zeit- und Kapazitätsplanung → Realisierung der Produktion → Produktionskontrolle"
    - "Ergebnis der Programmplanung ist das Produktionsprogramm"
    - "Produktion (Herstellung, Assembly) und Beschaffung (Materialnachfrage, Verwaltung des Inventars, Bestellung) als eigene Bereiche darunter"
    - "Rückkopplung der Produktionskontrolle auf die Planungsschritte"
  common_mistakes:
    - "Materialbedarfsplanung und Zeit- und Kapazitätsplanung vertauscht"
    - "Produktionskontrolle als Planungsschritt vor der Realisierung eingeordnet"
    - "Beschaffung weggelassen"
reconstruction:
  status: faithful
  svg: figures/reconstructed/abb-60.svg
  notes: >-
    Per Nebeneinander-Vergleich mit dem Original geprüft; alle Texte, Chevrons, Verbindungslinien
    und Pfeilspitzen übernommen. Grautöne der Chevrons angenähert (im Original leicht rötlich
    getönte Hellgrautöne). Pfeilspitzen als eigene Dreiecke gezeichnet. Wortlaut „Assembly“
    (englisch) unverändert. Der Titel der Abbildung lautet im Skript „Produktionsprogrammplanung“,
    obwohl der gesamte Produktionsplanungsprozess gezeigt wird.
