id: abb-51
title: Planungsvorgehen nach Grundig
type: prozess
description: >-
  Sechs Kästen in einer Zeile, durch Pfeile von links nach rechts verbunden: Zielplanung →
  Vorplanung → Grobplanung → Feinplanung → Ausführungsplanung → Ausführung. Der hervorgehobene
  Kasten „Grobplanung“ enthält zwei Unterkästen „Ideal“ und „Real“. Unter jedem Kasten steht eine
  Nummer 3.4.1 bis 3.4.6.
