curves: []
meaning: >-
  Das Planungsvorgehen nach Grundig (Skript 8.2.2–8.2.7) gliedert die Fabrikplanung in
  aufeinander aufbauende Phasen: Zielplanung (Zielvorgaben und Planungsgrundlagen, z. B.
  Flexibilität/Wandlungsfähigkeit neben Auslastung), Vorplanung (IST-Analyse, SOLL-
  Produktionsprogramm, wichtigste Verfahren), Grobplanung (Dimensionierung, ideales
  Funktionsschema, ideales Block-Layout, dann Ableitung des Reallayouts – daher „Ideal“ und
  „Real“), Feinplanung (Detaillierung bis zur Ausführungsreife), Ausführungsplanung
  (Arbeitspakete, Ablauf- und Terminpläne, Umzugsplanung u. a.) und Ausführung. Die Nummern
  3.4.1–3.4.6 sind die Kapitelnummern der Quelle (Grundig), nicht die des Skripts.
