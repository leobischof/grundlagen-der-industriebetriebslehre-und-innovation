curves: []
meaning: >-
  Skript 9.1.6: Die Kapazitätsplanung soll einen permanenten Abgleich von Kapazitätsbedarf und
  tatsächlich verfügbarer Kapazität gewährleisten und so eine (optimale) Kapazitätsauslastung
  sicherstellen. Lang- und mittelfristige Diskrepanzen führen zur Angleichung der Betriebsmittel
  (Investition / Kapazitätsabbau) und zum Einstellen oder Abbauen von Mitarbeitern; kurzfristige
  Anpassungen betreffen Beginn, Ende oder Betriebszeiten von Aufträgen, die Verlagerung von
  Produktionsschritten sowie die verfügbare Arbeitszeit (Überstunden, Extra-Schicht,
  Leerlaufzeit). Die Abbildung unterscheidet dabei zwei Richtungen: das Angebot an den Bedarf
  angleichen (Kapazitätsabgleich) oder den Bedarf an das Angebot anpassen (Kapazitätsanpassung).
exam_relevance:
  level: mittel
  reason: >-
    In exams/topic-mapping.json ist der Abbildung keine Frage zugeordnet. Die Unterscheidung
    Kapazitätsabgleich vs. Kapazitätsanpassung mit Maßnahmen ist aber klassischer
    Aufzähl-/Erklärstoff; daher mittel.
  question_ids: []
drawing:
  difficulty: mittel
  must_know:
    - "Eingänge: Kapazitätsanforderungen und tatsächlich verfügbare Kapazität"
    - "Kapazitätsabgleich = Angebot an Bedarf angleichen; Kapazitätsanpassung = Bedarf an verfügbare Kapazität anpassen"
    - "Maßnahmen Kapazitätsabgleich: Betriebsmittel erweitern, neue Mitarbeiter, Leasing, Überstunden, Kurzarbeit, Entlassung"
    - "Kapazitätsanpassung: zeitabhängig (Überlappung, Lageraufträge, Auftragsfertigung) und technologisch (Marketing, Rationalisierung, Produktion verlagern)"
  common_mistakes:
    - "Abgleich und Anpassung vertauscht (Richtung Angebot ↔ Bedarf verwechselt)"
    - "Maßnahmen der zeitabhängigen und der technologischen Anpassung vermischt"
