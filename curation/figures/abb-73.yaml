id: abb-73
title: Kapazitätsplanung
type: hierarchie
description: >-
  Baumdiagramm: Oben stehen die beiden Eingangsgrößen „Kapazitätsanforderungen“ und „Tatsächlich
  verfügbare Kapazität“, die im dunklen Kasten „Kapazitätsplanung“ zusammenlaufen. Darunter
  verzweigt die Kapazitätsplanung in „Kapazitätsabgleich“ (Angleichung des Kapazitätsangebots an
  den Kapazitätsbedarf) mit einer Liste von Maßnahmen und in „Kapazitätsanpassung“ (Anpassung des
  Kapazitätsbedarfs an verfügbaren Kapazitäten), die sich in zeitabhängige und technologische
  Anpassung mit je eigener Maßnahmenliste teilt.
