id: abb-22
title: Entrepreneurship-Prozess
type: prozess
description: >-
  Drei untereinanderliegende graue Phasenbalken, jeweils mit nummeriertem dunklem Kreis und
  Phasennamen links und drei weißen Schrittkästen rechts: 1 Erkennungsphase (Marktpotential,
  Unternehmerische Gelegenheit, Geschäftsidee), 2 Entwicklungsphase (SWOT, etc., Businessplan,
  Gründungsvorbereitung), 3 Umsetzungsphase (Gründung, Wachstum, Stabilisierung). Ein
  Winkelpfeil führt vom letzten Kasten einer Phase an den Anfang der nächsten Phase.
