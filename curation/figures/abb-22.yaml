curves: []
meaning: >-
  Laut Skript (4.2.4) gliedert sich der Entrepreneurship-Prozess in drei Hauptphasen. In der
  Erkennungsphase erkennt der Gründer ein Marktpotenzial (erwartete Nachfrage größer als die
  aktuelle), daraus eine unternehmerische Chance und entwickelt eine Geschäftsidee. In der
  Entwicklungsphase wird die Machbarkeit geprüft (z. B. SWOT), ein Businessplan erstellt und bei
  positivem Ergebnis die Gründung vorbereitet (Rechtsform, Organisation, nötiges Wissen). In der
  Umsetzungsphase erfolgt die formale Gründung, danach folgen individuell Wachstum und
  Stabilisierung.
