id: abb-21
title: Richtungen des Entrepreneurship
type: sonstiges
description: >-
  Liste aus sieben grauen Überschriftenbalken mit weißer Schrift, unter jedem zwei bis drei
  Stichpunkte: High-Tech Entrepreneurship, Regional Entrepreneurship, Social Entrepreneurship,
  Ecopreneurship, Senior Entrepreneurship, Serial Entrepreneurship und Intrapreneurship mit
  ihren jeweiligen Merkmalen.
