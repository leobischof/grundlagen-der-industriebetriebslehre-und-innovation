curves: []
meaning: >-
  Neben den Haupttypen SME und IDE kann ein Entrepreneur laut Skript (4.2.3) verschiedene
  Richtungen einschlagen; die Abbildung beschreibt sieben davon mit ihren Kennzeichen, von
  wissens- und kapitalintensivem High-Tech Entrepreneurship über regionale, soziale und
  ökologische Ausrichtungen bis zu Senior-, Serien- und Intrapreneurship (unternehmerisches
  Handeln von Nicht-Eigentümern im bestehenden Unternehmen).
exam_relevance:
  level: niedrig
  reason: >-
    In exams/topic-mapping.json ist der Abbildung keine Prüfungsfrage zugeordnet; die Abbildung
    ist eine reine Aufzählung ohne eigenen Erklärtext im Skript.
  question_ids: []
drawing:
  difficulty: leicht
  must_know:
    - "Sieben Richtungen: High-Tech, Regional, Social, Ecopreneurship, Senior, Serial, Intrapreneurship"
    - "Je Richtung ein Kernmerkmal (z. B. Serial = Mehrfach-/Seriengründer, Intrapreneurship = im bestehenden Unternehmen)"
  common_mistakes:
    - "Intrapreneurship als eigene Gründung statt als Unternehmertum im bestehenden Unternehmen beschrieben"
reconstruction:
  status: faithful
  svg: figures/reconstructed/abb-21.svg
  notes: >-
    Per Nebeneinander-Vergleich mit dem Original geprüft; die leicht strukturierten grauen Balken
    sind als flache abgerundete graue Rechtecke gezeichnet. Alle Stichpunkte im Originalwortlaut
    einschließlich der grammatischen Unebenheiten („die Herausforderungen … zu lösen“, „den
    nächsten Projekt“, „das lösen“). Die Aufzählungspunkte sind keine Lösungselemente.
