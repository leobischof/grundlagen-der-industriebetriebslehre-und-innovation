  must_know:
    - "Prozess A → Analyse und Kritik → Abänderung → zurück zu Prozess A (Schleife)"
    - "Nachgelagerte Prozesse B–E zeigen alle auf „Analyse und Kritik“"
  common_mistakes:
    - "Pfeile von B–E in die falsche Richtung (sie liefern Feedback, empfangen nichts)"
    - "Rückkopplung über „Abänderung“ vergessen"
