id: abb-32
title: Point-based Concurrent Engineering
type: flussdiagramm
description: >-
  Rahmen mit der Überschrift „Point-Based Concurrent Engineering“. „Prozess A“ gibt per Pfeil an
  „Analyse und Kritik“ weiter. Von rechts zeigen die vier untereinander stehenden Kästchen
  „Prozess B“ bis „Prozess E“ mit schrägen Pfeilen auf „Analyse und Kritik“. Von dort führt ein
  Winkelpfeil nach unten zu „Abänderung“, und von „Abänderung“ ein Winkelpfeil zurück nach oben
  zu „Prozess A“ – eine Rückkopplungsschleife.
