curves: []
meaning: >-
  Im Point-based Concurrent Engineering (PBCE) können nachgelagerte Prozesse auf Basis ihrer
  Erfahrungen die vorgelagerten Aktivitäten beeinflussen (sec-5.6). Feedback-Schleifen in frühen
  Phasen erlauben Änderungen mit geringerem Aufwand und geringeren Kosten; es wird iteriert, um eine
  einzelne Lösung („Punkt“) Schritt für Schritt zu verbessern. Gegensatz: der rein serielle Ansatz
  (Abbildung 31) und Set-based Concurrent Engineering (Abbildung 33).
