id: abb-56
title: Beispiele für das Spannungsfeld unternehmerischen Wirkens
type: system
description: >-
  Ein gleichseitiges Dreieck, in dessen Innerem „Interessenausgleich“ und „Zieloptimierung“
  stehen. An den drei Ecken stehen die Dimensionen der Nachhaltigkeit mit Beispielzielen: oben die
  Ökonomische Dimension (Rentabilität/Liquidität, Wirtschaftlichkeit/Produktivität,
  Erfolgspotentiale/Wettbewerbsfähigkeit), links unten die Soziale Dimension
  (Arbeitsmotivation/-zufriedenheit, Humane Arbeitsbedingungen, Mitbestimmung,
  Arbeitsplatzerhaltung/-schaffung) und rechts unten die Ökologische Dimension (Rohstoffschonung,
  Okkupation/Emission, Wahrung der natürlichen Lebensgrundlagen, Sicherung der Lebensqualität).
