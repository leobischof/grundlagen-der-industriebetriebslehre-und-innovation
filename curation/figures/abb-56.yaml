meaning: >-
  Laut Skript (8.3.2) müssen Unternehmen wegen geänderter Vorgaben und Regulierungen (z. B.
  EU-Taxonomie, CO2-Bepreisung), steigender Nachfrage nach nachhaltigen Produkten und geänderter
  Mitarbeiterbedürfnisse neben ökonomischen Zielen verstärkt auch soziale und ökologische Ziele
  verfolgen. Die drei Dimensionen stehen in einem Spannungsfeld: Unternehmerisches Wirken verlangt
  einen Interessenausgleich und eine Zieloptimierung zwischen ihnen. Ökonomische Nachhaltigkeit
  heißt dauerhaft gewinnorientiert wirtschaften ohne Ressourcenverknappung, ökologische zeigt sich
  im Energie- und Materialverbrauch, in Abfällen und CO2-Emissionen, soziale betrifft die
  Auswirkungen des Unternehmens auf Mitarbeitende, Kunden und lokale Gemeinschaften.
