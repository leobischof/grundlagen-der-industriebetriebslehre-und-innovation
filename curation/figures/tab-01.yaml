curves: []
meaning: >-
  Laut Skript (1.2.1) zeigt der Blick auf die Beschäftigtenzahlen die Bedeutung der Industrie für
  den Arbeitsmarkt: Rund ein Viertel aller unselbständig Beschäftigten in Österreich arbeitet in
  der Industrie (2023 knapp eine Million Menschen, 25,4 %). Der Anteil ist seit 2000 (29,1 %)
  gesunken, obwohl die absolute Zahl der Industriebeschäftigten zuletzt wieder gestiegen ist – die
  Gesamtbeschäftigung wuchs schneller.
exam_relevance:
  level: niedrig
  reason: >-
    In exams/topic-mapping.json ist der Tabelle keine Prüfungsfrage zugeordnet. Einzelzahlen werden
    nicht gezeichnet; merkenswert ist nur die Größenordnung (etwa ein Viertel der Beschäftigten in
    der Industrie).
  question_ids: []
drawing:
  difficulty: leicht
  must_know:
    - "Industriebeschäftigte = Bergbau + Sachgütererzeugung + Energie-/Wasserversorgung + Baugewerbe"
    - "Anteil an der Gesamtbeschäftigung rund 25 % (2023: 25,4 %), Tendenz seit 2000 fallend"
  common_mistakes:
    - "Baugewerbe nicht zur Industrie gezählt"
    - "Steigende absolute Zahl mit steigendem Anteil verwechselt"
reconstruction:
  status: faithful
  svg: figures/reconstructed/tab-01.svg
  notes: >-
    Per Nebeneinander-Vergleich mit dem Original geprüft; alle Zellen mit Wortlaut, Zahlen,
    Fettdruck und grauer Kopfzeile/Vorspalte übernommen. Zahlen zusätzlich mit der Textschicht des
    PDFs abgeglichen. Hinweis zum Original: Für 2023 ergibt die Summe der vier Bereiche 984.850,
    die Tabelle nennt 986.614 Industriebeschäftigte (für 2000–2020 stimmen die Summen); die Zahl
    ist unverändert aus dem Skript übernommen.
