id: tab-01
title: Unselbständig Beschäftigte in Österreich
type: tabelle
description: >-
  Tabelle mit grau hinterlegter Kopfzeile (Jahr 2000, 2010, 2020, 2023) und grau hinterlegter
  Vorspalte. Die Zeilen nennen die Gesamtbeschäftigung, die vier Industriebereiche Bergbau,
  Sachgütererzeugung, Energie-/Wasserversorgung und Baugewerbe, deren Summe als
  Industriebeschäftigte sowie den %-Anteil der Industriebeschäftigten an der Gesamtbeschäftigung.
