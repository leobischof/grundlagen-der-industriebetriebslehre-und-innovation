meaning: >-
  Die Kontrolle im operativen Produktionsmanagement beurteilt Prozesse und Output einer Produktion
  mit Leistungskennzahlen (Key Performance Indicators). Das Skript (9.3) wählt fünf KPIs aus und
  behandelt sie anschließend einzeln in 9.3.1 bis 9.3.5: Qualität, Geschwindigkeit,
  Zuverlässigkeit/Liefertreue, Flexibilität und Kosten.
