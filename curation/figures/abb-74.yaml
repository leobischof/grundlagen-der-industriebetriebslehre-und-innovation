curves: []
meaning: >-
  Skript 9.1.7: Die theoretische Kapazität ist in der Praxis nicht immer erreichbar (z. B.
  Wartung); der Rest ist die effektive Kapazität. Die Gesamtanlageneffektivität (GAE, englisch
  Overall Equipment Effectiveness, OEE) misst die Wirksamkeit eines Betriebsmittels anhand (1) der
  verfügbaren Betriebsmittelzeit, (2) der Geschwindigkeit bzw. Durchsatzrate und (3) der
  erreichten Qualität: GAE = Verfügbarkeitsrate · Leistungsrate · Qualitätsrate. Sie gibt die
  wertvolle Betriebszeit in Prozent der theoretischen Kapazität an; um die effektive Kapazität zu
  erhöhen, muss ein Betriebsmittel in allen drei Dimensionen gut sein.
exam_relevance:
  level: hoch
  reason: >-
    Laut exams/topic-mapping.json zweimal abgefragt (2025-03-18 und 2026-01-22): Gesamtanlagen-
    effektivität definieren, Kenngrößen und Berechnung erklären – genau der Inhalt der Abbildung.
  question_ids: [frage-2025-03-18-4, frage-2026-01-22-5]
drawing:
  difficulty: schwer
  must_know:
    - "Vier Zeitstufen: verfügbare → insgesamt → netto → wertschöpfende Betriebsmittelzeit"
    - "Drei Verlustarten: Verfügbarkeit, Geschwindigkeit, Qualität mit ihren Ursachen"
    - "a = Netto Betriebsmittelzeit / verfügbare Betriebsmittelzeit"
    - "p = Nutzbare Betriebsmittelzeit / Netto Betriebsmittelzeit"
    - "q = Wertschöpfende Betriebsmittelzeit / Nutzbare Betriebsmittelzeit"
    - "OEE = a · p · q"
  common_mistakes:
    - "Kennzahlen addiert statt multipliziert"
    - "Verlustursachen der falschen Kennzahl zugeordnet (z. B. Leerlauf zur Verfügbarkeit)"
    - "Zähler und Nenner der Raten vertauscht"
reconstruction:
  status: faithful
  svg: figures/reconstructed/abb-74.svg
  notes: >-
    Per Nebeneinander-Vergleich mit dem Original geprüft; Balkenlängen, Kästen und Verbindungslinien
    positionsgetreu, Pfeilspitzen als eigene Dreiecke (keine SVG-Marker). Die Formeln sind im
    Original in einer kursiven Serifenschrift (Formelsatz) gesetzt und hier als kursive
    Arial-Texte mit Bruchstrich wiedergegeben; der Malpunkt in OEE = a · p · q als „·“. Wortlaut
    inklusive „Einrichten und Umrüste“ und „Nutzabre Betriebsmittelzeit“ unverändert aus dem
    Original übernommen. Einen eigenen Balken „Nutzbare Betriebsmittelzeit“ (Netto
    Betriebsmittelzeit abzüglich Geschwindigkeitsverlusten) zeigt das Original nicht, obwohl p und
    q diese Größe verwenden – so übernommen.
