id: abb-74
title: Gesamtanlageneffektivität
type: flussdiagramm
description: >-
  Zerlegung der Betriebsmittelzeit mit Kennzahlen: Links vier dunkle Zeitbalken, die von oben
  nach unten kürzer werden (Verfügbare Betriebsmittelzeit, Betriebsmittelzeit insgesamt, Netto
  Betriebsmittelzeit, Wertschöpfende Betriebsmittelzeit); der hellgraue Rest am Ende der unteren
  drei Balken ist jeweils der Verlust (Verluste bei der Verfügbarkeit, Geschwindigkeitsverluste,
  Qualitätsverluste). Von jedem Verlust führen Pfeile zu seinen Ursachen und weiter zur
  zugehörigen Kennzahl mit Formel (Verfügbarkeitsrate a, Leistungsindex p, Qualitätsrate q).
  Alle drei Kennzahlen münden rechts in „Gesamtanlageneffektivität“ mit OEE = a · p · q.
