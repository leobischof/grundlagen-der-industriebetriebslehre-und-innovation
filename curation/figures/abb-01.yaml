id: abb-01
title: Historische Entwicklung innerhalb der Industrie
type: prozess
description: >-
  Treppendiagramm von links unten nach rechts oben: Vier Stufen, jeweils ein waagrechtes
  Linienstück mit zwei grauen Punkten, sind durch senkrechte Linien verbunden. Jede Stufe trägt
  eine Bezeichnung (1. bis 4. Industrielle Revolution), darunter steht das Schlagwort der Stufe
  (Mechanisierung, Elektrifizierung, Information/Automatisierung, Digitalisierung/Vernetzung) mit
  einer kurzen Erklärung. Links neben jeder Stufe illustriert ein Piktogramm die Epoche
  (Zahnräder, Arbeiter am Fließband, Roboterarm, Kreislauf aus Roboterarm, Mensch, Smartphone und
  WLAN).
