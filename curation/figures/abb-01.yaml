curves: []
meaning: >-
  Laut Skript (1.1) begann die erste industrielle Revolution um 1750 mit der Dampfmaschine
  (Mechanisierung). Die zweite war organisationsgetrieben (Fließband nach Ford, Taylor) und
  beruhte auf elektrischen Antrieben und großindustrieller Massenproduktion. Die dritte setzte
  Anfang der 60er Jahre mit Elektronik, speicherprogrammierbarer Steuerung und Industrierobotern
  ein und brachte die Automatisierung sowie den IT-Sektor hervor. Die vierte („Industrie 4.0“)
  wird von Digitalisierung, cyberphysikalischen Systemen, Big-Data-Analyse und dem industriellen
  Internet der Dinge getragen: Menschen, Maschinen und Produkte werden vernetzt. Die Treppe zeigt
  die stufenweise Steigerung der Produktivität.
exam_relevance:
  level: mittel
  reason: >-
    In exams/topic-mapping.json ist der Abbildung keine Prüfungsfrage zugeordnet. Die vier
    Revolutionen mit ihren Schlagworten sind aber Grundwissen des Einstiegskapitels und lassen sich
    leicht als Aufzähl- oder Zeichenaufgabe abfragen, daher mittel.
  question_ids: []
drawing:
  difficulty: leicht
  must_know:
    - "Vier Stufen in aufsteigender Treppe, von links unten nach rechts oben"
    - "Schlagworte in Reihenfolge: Mechanisierung – Elektrifizierung – Information/Automatisierung – Digitalisierung/Vernetzung"
    - "Je Stufe die Kernaussage: Wasser und Dampf; arbeitsteilige Konzepte mit elektrischer Energie; Elektronik und IT; Vernetzung von Maschinen, Arbeitern und Produkten"
  common_mistakes:
    - "Elektrifizierung und Automatisierung vertauscht"
    - "Zweite Revolution nur als „Elektrizität“ beschrieben, ohne die arbeitsteiligen Konzepte (Fließband)"
    - "Vierte Revolution auf Digitalisierung reduziert, ohne die Vernetzung von Maschinen, Arbeitern und Produkten"
reconstruction:
  status: faithful
  svg: figures/reconstructed/abb-01.svg
  notes: >-
    Per Nebeneinander-Vergleich mit dem Original geprüft; alle Texte, die Treppe mit den acht
    Punkten und die drei Kreislaufpfeile stimmen überein. Die Piktogramme (Zahnräder, Arbeiter am
    Fließband, Roboterarm, Roboterarm/WLAN/Mensch/Smartphone) sind nicht nachgebildet, sondern durch
    freie Bibliotheksicons aus Lucide bzw. Material Design Icons angenähert. Ihre Bedeutung bleibt
    zusätzlich als Text erhalten; Quellen und Lizenzen stehen in curation/icon-provenance.json
    und curation/icon-library-licenses.txt. Die strukturierte Füllung der
    Punkte ist als einfaches Hellgrau wiedergegeben. Der am oberen Rand des Scan-Ausschnitts
    angeschnittene Text (Bildunterschrift) gehört nicht zur Abbildung und fehlt. Wortlaut ohne
    Leerzeichen nach der Ordnungszahl („1.Industrielle Revolution“) wie im Original.
