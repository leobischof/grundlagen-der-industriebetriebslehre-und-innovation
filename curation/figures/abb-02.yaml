id: abb-02
title: Mögliche Elemente eines Betriebs der Industrie 4.0
type: system
description: >-
  Übersicht in drei Spalten mit dunklen Kopfbalken: links „Lieferanten“, in der Mitte die breite
  Spalte „Produktion“, rechts „Kunden“. Die 15 nummerierten Elemente stehen als Kästen darunter.
  Die Produktion ist in die Ebenen „Software“ (Elemente 2–5) und „Shopfloor“ (Elemente 6–14)
  gegliedert. Eine Legende unterscheidet IoT-bezogene Elemente (durchgezogener, grau gefüllter
  Kasten) von nicht IoT-bezogenen (strichpunktierter, weißer Kasten); nicht IoT-bezogen sind nur
  Additive Fertigung, Robotik sowie Neue Materialien & Nanowerkstoffe.
