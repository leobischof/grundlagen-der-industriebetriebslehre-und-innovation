curves: []
meaning: >-
  Laut Skript (1.1) steht Industrie 4.0 für eine neue Stufe in der Organisation und Steuerung der
  gesamten Wertschöpfungskette über den Lebenszyklus von Produkten – vom Lieferanten über die
  Produktion bis zum Kunden. Basis ist die Verfügbarkeit aller relevanten Informationen in
  Echtzeit durch die Vernetzung aller beteiligten Einheiten. Die Abbildung zeigt, welche
  Technologien ein solcher Betrieb einsetzen kann, und dass die meisten davon auf dem Internet der
  Dinge (IoT) beruhen. Als Enabler nennt das Skript den Preisverfall industrieller Hard- und
  Software, die Weiterentwicklung von Hard- und Software, die Ausbreitung des Internets und neue
  Technologien wie KI und Cloud-Computing.
