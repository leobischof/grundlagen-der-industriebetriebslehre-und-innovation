meaning: >-
  Laut Skript (9.1.3) müssen Endprodukte für die Materialbedarfsplanung in Baugruppen und
  Komponenten untergliedert werden; die Stückliste nennt die je Produkteinheit benötigten Mengen.
  Zur Veranschaulichung der Stückliste kann ein Gozintograph („goes into“) gezeichnet werden: Er
  zeigt, welche Teile (P) in welche Montagen/Baugruppen (A) und schließlich in das Produkt
  eingehen, gegliedert nach Produktionsphasen. Begriffe laut Skript (DIN 199): Produkt (endgültiges
  Produktionsergebnis), Baugruppe (aus zwei oder mehr Teilen/Baugruppen niedrigerer Ordnung),
  Einzelteil (nicht zerstörungsfrei zerlegbar), Rohmaterial (Ausgangsmaterial). Mengenangaben an
  den Pfeilen enthält diese Abbildung nicht.
exam_relevance:
  level: mittel
  reason: >-
    Laut exams/topic-mapping.json einmal abgefragt (2025-02-04, nur als Stichwort
    „Gozintograph“ überliefert, Gedächtnisprotokoll): Erklären bzw. Zeichnen eines Gozintographen
    ist wahrscheinlich, eine Bedarfsrechnung ist nicht ausgeschlossen.
  question_ids: [frage-2025-02-04-2]
drawing:
  difficulty: mittel
  must_know:
    - "Endprodukt oben, Teile unten; Pfeile zeigen von unten nach oben in das übergeordnete Element"
    - "Unterscheidung Teil (P, Kasten) und Montage/Baugruppe (A, Kreis) mit Legende"
    - "Gliederung nach Produktionsphasen 0 bis 3"
    - "Ein Teil kann in mehrere Montagen eingehen (P2 → A1 und A2)"
  common_mistakes:
    - "Pfeilrichtung umgekehrt (vom Produkt zu den Teilen)"
    - "Teile und Baugruppen nicht unterschieden"
    - "Mehrfachverwendung eines Teils (P2) nicht dargestellt"
