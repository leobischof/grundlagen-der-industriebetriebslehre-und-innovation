id: abb-66
title: Gozintograph
type: hierarchie
description: >-
  Gozintograph für Produkt A über vier Produktionsphasen (Zeilen 0 bis 3). Oben das Endprodukt
  „Produkt A“ (Phase 0), darunter die Montagen A3 und A4 (Phase 1), dann Montage A1 und die Teile
  P5, P6 sowie Montage A2 und Teil P7 (Phase 2), unten die Teile P1, P2, P3, P4 (Phase 3).
  Pfeile zeigen jeweils in das übergeordnete Element, in das ein Teil bzw. eine Montage eingeht.
  P2 geht sowohl in A1 als auch in A2 ein. Legende: P....Teil, A....Montage.
