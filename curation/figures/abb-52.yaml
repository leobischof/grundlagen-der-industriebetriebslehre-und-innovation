    Detail der Dimensionierung und eher als Hintergrundwissen zur Grobplanung relevant.
  question_ids: []
drawing:
  difficulty: mittel
  must_know:
    - "Grundstück → Unbebaute und Bebaute Fläche"
    - "Bebaute Fläche: Nutz-, Neben-, Funktions-, Sozialflächen"
    - "Nutzflächen: Produktion, Lager, Verwaltung, Hilfs- und Nebenbetriebe"
  common_mistakes:
    - "Verkehrsflächen und Transportwege verwechselt (Verkehrsfläche ist unbebaut, Transportwege sind Nebenflächen)"
    - "Sanitär zu den Sozialflächen statt zu den Nebenflächen gezählt"
