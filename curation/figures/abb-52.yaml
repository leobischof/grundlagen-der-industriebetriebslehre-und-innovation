id: abb-52
title: Auszug aus der Gliederung der Flächen
type: hierarchie
description: >-
  Baumdiagramm der Flächengliederung (nach DIN 277): Das „Grundstück“ teilt sich in „Unbebaute
  Fläche“ (Verkehrsfläche, Parkplätze, Versorgungs- und Nutzflächen, Grün- und Freiflächen,
  Reserveflächen) und „Bebaute Fläche“. Die bebaute Fläche gliedert sich in Nutzflächen
  (Produktion, Lager, Verwaltung, Hilfs- und Nebenbetriebe), Nebenflächen (Sanitär,
  Transportwege), Funktionsflächen (Heizung- und Klimaanlage) und Sozialflächen (Verpflegung,
  Bildungseinrichtungen, Erholung).
