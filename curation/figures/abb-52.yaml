meaning: >-
  Bei der Dimensionierung in der Grobplanung (8.2.5.1) ist der Flächenbedarf zu ermitteln, der u. a.
  großen Einfluss auf die Investitionen hat. Grundlage der Berechnung ist eine Einteilung aller
  Flächen, wie sie die Gliederung nach DIN 277 zeigt. Auf dieser Gliederung bauen globale und
  detaillierte Flächenermittlungsverfahren auf.
exam_relevance:
