id: abb-29
title: Magisches Dreieck der Produktentstehung
type: sonstiges
description: >-
  Graues gleichseitiges Dreieck. Von einem gemeinsamen Mittelpunkt laufen drei gestrichelte
  Achsenpfeile durch die Ecken nach außen; an den Ecken stehen „Qualität“ (oben), „Zeit“ (links
  unten) und „Kosten“ (rechts unten).
