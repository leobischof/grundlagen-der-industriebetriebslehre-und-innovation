curves: []
meaning: >-
  Das „magische Dreieck“ der Produktentstehung besteht aus Kosten, Zeit und Qualität; die drei
  Ziele konkurrieren miteinander. Simultaneous Engineering soll alle drei zugleich optimieren:
  kürzere Time-to-Market (Entwicklungszeit), geringere Entwicklungs- und Produktionskosten und
  bessere Produkt-, Prozess- und Planungsqualität (Skript 5.6).
