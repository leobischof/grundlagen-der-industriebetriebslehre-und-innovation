curves: []
meaning: >-
  Bei der Punktfertigung (stationäre oder Baustellenfertigung) ist das Erzeugnis bis zu seiner
  Fertigstellung fix ortsgebunden; Fertigungsmittel werden am Bearbeitungsobjekt gebündelt und
  können ortsfest oder ortsveränderlich sein (Skript 8.2.1). Die Ressourcen kommen also zum
  Produkt, nicht umgekehrt. Einsatz bei schwer bewegbaren Arbeitsgegenständen, z. B. Anlagen-,
  Großmaschinen- und Schiffsbau sowie Baustellenprozesse.
