id: abb-47
title: Punktfertigung
type: system
description: >-
  In der Mitte steht eine dunkle Ellipse „Produkt“. Drei breite graue Pfeile zeigen von außen auf
  das Produkt: von links oben „Personal“, von rechts oben „Material“ und von unten „Information“.
