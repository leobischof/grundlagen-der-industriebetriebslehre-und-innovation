  - {id: t2, kind: label, text: Industrieunternehmen mit sekundären Dienstleistungen}
  - {id: t3, kind: label, text: Industrieunternehmen mit primären Dienstleistungen}
  - {id: t4, kind: label, text: Dienstleistungsunternehmen mit Verkauf von Sachgütern, note: "umbrochen als „Dienstleistungs / -unternehmen“"}
  - {id: t5, kind: label, text: "„reine“ Dienstleistungsunternehmen", note: "Pfeil ganz rechts; „Dienstleistungs / -unternehmen“"}
relations:
