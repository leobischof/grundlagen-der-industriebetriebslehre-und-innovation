  - {from: t2, to: t3, kind: folgt}
  - {from: t3, to: t4, kind: folgt}
  - {from: t4, to: t5, kind: folgt}
curves: []
meaning: >-
  Ein Industriebetrieb produziert und vertreibt vorwiegend Sachgüter und steht damit im Gegensatz
  zum Dienstleistungsbetrieb, der vor allem Services entwickelt und verkauft. Die Grenze ist
  fließend: Zwischen „reinen“ Industrie- und „reinen“ Dienstleistungsunternehmen liegen Mischformen,
  deren Leistungsbündel unterschiedlich große Sachgüter- und Dienstleistungsanteile hat (Skript 3.1.1,
  S. 48–49).
