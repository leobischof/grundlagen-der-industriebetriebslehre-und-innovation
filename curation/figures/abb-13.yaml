id: abb-13
title: Abgrenzung zwischen Industrie- und Dienstleistungsbetrieb
type: sonstiges
description: >-
  Kontinuum als Rechteck, das diagonal geteilt ist: Das helle Dreieck links unten steht für den
  Anteil der Sachgüter, das dunkle Dreieck rechts oben für den Anteil der Dienstleistungen. Von
  links nach rechts sinkt der Sachgüteranteil und steigt der Dienstleistungsanteil. Fünf Pfeile
  von oben markieren Unternehmenstypen auf dem Kontinuum: „reine“ Industrieunternehmen,
  Industrieunternehmen mit sekundären Dienstleistungen, Industrieunternehmen mit primären
  Dienstleistungen, Dienstleistungsunternehmen mit Verkauf von Sachgütern und „reine“
  Dienstleistungsunternehmen.
axes:
  - {axis: x, label: "Kontinuum von Sachgütern zu Dienstleistungen (unbeschriftet)", unit: null, direction: "rechts = mehr Dienstleistungsanteil"}
elements:
