  svg: figures/reconstructed/abb-08.svg
  notes: >-
    Visuell per Überlagerung mit dem Original geprüft. Kurvenverlauf als Bézier-Pfad nachgezeichnet
    (kleine Abweichungen im Bereich des Maximums). Der Zeilenumbruch „Marktvorber-/eitung“ des
    Originals ist übernommen; Schrift Arial statt der Originalschrift.
