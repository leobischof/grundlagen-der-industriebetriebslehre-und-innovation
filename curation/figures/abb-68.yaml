curves: []
meaning: >-
  Skript 9.1.3.1: Es gibt im Allgemeinen drei Materialklassen. Rohstoffe gehen direkt in Bauteil,
  Baugruppe oder Produkt ein (unverändert oder verändert; Rohmaterial zur Weiterverarbeitung oder
  halbfertige bzw. gekaufte Teile). Hilfsstoffe werden nur indirekt benötigt und sind nur in
  unbedeutenden Mengen im Produkt (z. B. Klebstoffe, Schweißzusatz). Betriebsstoffe halten den
  Betrieb der Produktionsanlagen aufrecht und gehen nicht ins Produkt ein (z. B. elektrische
  Energie, Wasser, Schmiermittel).
