id: abb-68
title: Materialklassen
type: hierarchie
description: >-
  Baumdiagramm: Der dunkle Wurzelkasten „Materialklassen“ verzweigt in drei gleichrangige Klassen
  Rohstoffe, Hilfsstoffe und Betriebsstoffe. Nur die Rohstoffe sind weiter unterteilt, und zwar
  in „Rohmaterial“ und „Teile, Gruppen“.
