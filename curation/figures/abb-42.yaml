meaning: >-
  Das Konzept Integriertes Management (Bleicher 2004) schafft laut Skript (7.2) eine gesamthaft
  angelegte Struktur, um Komplexität und Dynamik in Management-Systemen zu berücksichtigen. Es
  unterscheidet drei Ebenen: Das Normative Management formuliert die Grundsätze (Vision,
  Unternehmensphilosophie, Unternehmenspolitik) für die folgenden Ebenen; das Strategische
  Management plant und implementiert die Unternehmensstrategie; das Operative Management vollzieht
  auf dieser Basis die vereinbarten Ziele bzw. Programme auf der Prozessebene. Jede Ebene wird über
  Strukturen, Aktivitäten und Verhalten gestaltet (horizontale Integration) und die Ebenen bauen
  aufeinander auf (vertikale Integration).
exam_relevance:
  level: mittel
  reason: >-
    In exams/topic-mapping.json keiner Prüfungsfrage zugeordnet. Die drei Managementebenen mit
    ihren Kennworten (begründend, ausrichtend, vollziehend) sind aber Grundbegriffe des Kapitels 7
    und eignen sich für Aufzählungs- oder Skizzenfragen.
