id: abb-42
title: Das Konzept Integriertes Management (UE = Unternehmensumgebung)
type: system
description: >-
  Ordnungsrahmen nach Bleicher: Oben fließt die „Managementphilosophie“ trichterförmig in die
  „Vision“. Darunter liegen drei Spalten (Strukturen, Aktivitäten, Verhalten), die von drei grauen
  Ebenenbalken geschnitten werden: Normatives Management = begründend, Strategisches Management =
  ausrichtend, Operatives Management = vollziehend. Je Ebene stehen links die Strukturen
  (Unternehmungsverfassung; Organisationsstrukturen, Managementsysteme; Organisatorische Prozesse,
  Dispositionssysteme), in der Mitte die Aktivitäten (Unternehmungspolitik mit Missionen;
  Programme; Aufträge) und rechts das Verhalten (Unternehmungskultur; Problemverhalten; Leistungs-
  und Kooperationsverhalten). Die mittlere Spalte mündet in einen Pfeil auf die
  „Unternehmungsumgebung“ mit innerer UE, äußerer UE sowie innerer und äußerer UE. Pfeile am Rand
  markieren die horizontale (nach rechts) und die vertikale Integration (nach unten).
