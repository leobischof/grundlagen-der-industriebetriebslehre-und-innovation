curves: []
meaning: >-
  Innovationsstrategien beschreiben laut Skript (4.1.2) die Wege, auf denen Unternehmensziele
  unter Berücksichtigung von Kosten und Zeit (meist fünf bis zehn Jahre) erreicht werden. Die
  Tabelle gibt einen Überblick über mögliche Kriterien, nach denen eine Innovationsstrategie
  ausgestaltet wird – vom dominierenden Wettbewerbsfaktor über Markt- und Zeitorientierung bis
  zum strategischen Schlüsselfaktor –, jeweils mit typischen Ausprägungen.
