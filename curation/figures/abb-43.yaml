curves: []
meaning: >-
  Laut Skript (8.1.1) bewirkt oft erst das gleichzeitige, manchmal fast unmerkliche Auftreten
  mehrerer interner und externer Faktoren ein schleichendes Absinken der Unternehmensergebnisse. Die
  Abbildung zeigt die wesentlichen Treiber, die einen Standort als Ganzes infrage stellen und damit
  eine Standortplanung auslösen. Die Reaktion (Reorganisation, Erweiterung, Neuplanung) darf nicht
  impulsiv aufgrund eines einzigen Faktors fallen, sondern erfordert eine sorgfältige strategische
  Planung.
exam_relevance:
  level: hoch
  reason: >-
    Laut exams/topic-mapping.json direkt abgefragt (2025-10-15): externe und interne Faktoren nennen
    und erläutern, die Auslöser für eine strategische Standortplanung sein können. Die Abbildung
    liefert die vollständige Aufzählung.
  question_ids: [frage-2025-10-15-2]
drawing:
  difficulty: mittel
  must_know:
    - "Extern: Technologie, Markt, Umwelt mit je drei Stichpunkten"
    - "Intern: Schwachstellen → Strategische Ziele (fünf Führerschaften)"
    - "Mitte: standortbezogene Reaktion = Reorganisation, Erweiterung, Neuplanung"
  common_mistakes:
    - "Umwelt-Faktoren (Faktorkosten, Auflagen, Steuern) als interne Treiber eingeordnet"
    - "Nur die Treiber aufgezählt, die drei möglichen Reaktionen vergessen"
    - "Pfeilrichtung zwischen Schwachstellen und Strategischen Zielen umgedreht"
