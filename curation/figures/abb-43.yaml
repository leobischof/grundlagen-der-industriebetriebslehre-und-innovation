id: abb-43
title: Interne und externe Treiber für standortbezogene Reaktionen
type: system
description: >-
  Oben ein mit „extern“ beschrifteter Rahmen mit drei grauen Kästen und Stichpunkten: Technologie
  (Werkstoffe, Fertigungsverfahren, Automatisierungstechnik), Markt (Individualisierung d.
  Kundenwünsche, Stärkere Verbrauchsschwankungen, Internationale Arbeitsteilung) und Umwelt
  (Faktorkosten, Gesetzliche Auflagen, Steuern/Abgaben). Unten ein mit „intern“ beschrifteter Rahmen:
  Schwachstellen (Mangelnde Logistikleistung, Mangelnde Prozesssicherheit, Hohe Produktionskosten,
  Kapazitätsengpässe) führen per Pfeil zu den Strategischen Zielen (Kosten-, Qualitäts-,
  Technologie-, Logistik-, Flexibilitätsführerschaft). Beide Rahmen zeigen mit je einem Pfeil auf
  die dunkle Ellipse in der Mitte: „standortbezogene Reaktion: Reorganisation-Erweiterung-Neuplanung“.
