reconstruction:
  status: faithful
  svg: figures/reconstructed/abb-48.svg
  notes: >-
    Visuell per Nebeneinander-Vergleich geprüft. Nur die drei Gruppennamen sind Lösungselemente;
    die Maschinenbuchstaben C/W/D/G sind generische Platzhalter (im Skript nicht erklärt) und
    bleiben in der Übung stehen. Rosa Hintergrund und Grautöne angenähert. Die Bedeutung der
    Buchstaben (vermutlich z. B. Drehen/Fräsen …) ist unsicher und wird nicht behauptet.
