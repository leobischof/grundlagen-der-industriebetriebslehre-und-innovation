id: abb-48
title: Gruppenfertigung
type: flussdiagramm
description: >-
  Drei rosa hinterlegte Bereiche „Produkt Gruppe A“, „Produkt Gruppe B“ und „Produkt Gruppe C“.
  Jeder Bereich enthält mehrere dunkle Maschinenkästen mit Buchstaben (C, W, D, G), die durch
  Materialflusspfeile verbunden sind: Gruppe A: C → W sowie ein zweiter Strang zu D; Gruppe B:
  G → D und C → W, von W ein Pfeil nach oben zu D; Gruppe C: C, darunter D → G, von D ein Pfeil
  nach oben zu C. Material tritt jeweils links ein und rechts aus.
axes: []
elements:
  - {id: ga, kind: box, text: Produkt Gruppe A, note: "Insel mit Maschinen C, W, D"}
  - {id: gb, kind: box, text: Produkt Gruppe B, note: "Insel mit Maschinen G, D, C, W"}
  - {id: gc, kind: box, text: Produkt Gruppe C, note: "Insel mit Maschinen C, D, G"}
  - {id: m, kind: label, text: "C, W, D, G", note: "Maschinentypen; Buchstaben werden im Skript nicht erklärt"}
relations:
  - {from: ga, to: ga, kind: pfeil, text: "C → W; zweiter Strang direkt zu D"}
  - {from: gb, to: gb, kind: pfeil, text: "G → D; C → W → D"}
  - {from: gc, to: gc, kind: pfeil, text: "D → G; D → C"}
curves: []
meaning: >-
  Gruppenfertigung (Nest-, Insel- oder Zellenfertigung) fasst laut Skript (8.2.1) die für gleiche
  oder verwandte Teilprozesse erforderlichen Maschinen und Arbeitsplätze verschiedener Art und
  Funktion örtlich zusammen – im Bild je eine Insel pro Produktgruppe mit unterschiedlichen
  Maschinentypen. Die Maschinen sind oft ringförmig angeordnet, mit flexiblen Transportmitteln
  verbunden und meist Universalmaschinen. Gegensatz zur Werkstattfertigung, die gleichartige
  Maschinen nach dem Verrichtungsprinzip zusammenfasst.
