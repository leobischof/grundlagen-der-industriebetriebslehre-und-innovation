  Produktionsprogramms in Kombination mit der Stückliste bestimmt. Ergebnis der
  Materialbedarfsplanung ist die optimale Materialversorgung für jeden Produktionsprozess
  hinsichtlich Timing, Qualität und Kosteneffizienz.
