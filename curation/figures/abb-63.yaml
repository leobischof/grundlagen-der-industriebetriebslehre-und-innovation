meaning: >-
  Laut Skript (9.1.2) legt die kurzfristige Produktionsprogrammplanung auf Basis der
  Verkaufsplanung fest, welche Produkttypen in welchen Mengen im Planungshorizont produziert
  werden. Ein Produktionsprogramm hat eine qualitative (welche Produkttypen), eine quantitative
  (wie viele) und eine zeitbasierte Komponente. Weitere Informationen sind die erwartete
  Nachfrage, die Verkaufspreisstrukturen, die Produktionskosten pro Einheit und der
  Kapazitätsbedarf pro Einheit.
