curves: []
meaning: >-
  Ziel der Produktentstehung ist es, ein Zielsystem (alle Ziele des neuen Produkts) mit einem
  Handlungssystem (z. B. ein Unternehmen mit seinen Ressourcen) in ein geeignetes Sachsystem
  (z. B. Simulationsmodelle, Prototypen, serienreife Produkte) zu transformieren (Skript 5.1).
  Diese Transformation findet im Modellbereich statt; durch die Produktion wird das Sachsystem im
  Objektbereich zum realen technischen Gebilde (hier eine Maschine), das Stoff, Energie und Signale
  umsetzt und an Markt und Nutzer geht.
exam_relevance:
  level: niedrig
  reason: >-
    In exams/topic-mapping.json keiner Frage zugeordnet. Begriffsmodell aus 5.1, das als
    Definitionswissen (Ziel-, Handlungs-, Sachsystem) abfragbar wäre.
  question_ids: []
drawing:
  difficulty: mittel
  must_know:
    - "Ziel-System → Handlungs-System → Sach-System im Modellbereich"
    - "Markt/Nutzer liefern die Anforderungen an das Ziel-System"
    - "Produktion überführt das Sach-System in den Objektbereich (reale Maschine)"
  common_mistakes:
    - "Reihenfolge der drei Systeme vertauscht"
    - "Handlungssystem mit Sachsystem verwechselt (Handlungssystem = ausführendes System, z. B. Unternehmen)"
reconstruction:
  status: faithful
  svg: figures/reconstructed/abb-25.svg
  notes: >-
    Per Nebeneinander-Vergleich mit dem Original geprüft; Blockgeometrie, Grautöne und Pfeillagen
    angenähert, alle Beschriftungen im Wortlaut. Das Werkzeugmaschinen-Piktogramm des Originals ist
    durch einen schlichten Umriss aus Rechtecken mit der Beschriftung „Maschine“ ersetzt. Die
    gestrichelten Linien nutzen stroke-dasharray
    (seit pipeline/svg_mupdf setzt auch der PDF-Export Strichelung und Marker um).
