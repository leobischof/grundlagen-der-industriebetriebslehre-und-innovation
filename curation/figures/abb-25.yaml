id: abb-25
title: Zielsystem, Handlungssystem und Sachsystem
type: system
description: >-
  Zwei versetzt übereinanderliegende 3-D-Blöcke. Unten der „Modellbereich“: Von links kommen
  „Markt“ und „Nutzer“ mit einem Pfeil ins „Ziel-System“, das über das „Handlungs-System“ zum
  „Sach-System“ führt. Oben rechts der „Objektbereich“: Eine „Maschine“ erhält „Stoff“, „Energie“
  und „Signal“ als Eingänge und gibt Stoff und Energie aus; ein Pfeil führt aus dem Block zu
  „Markt“ und „Nutzer“. Gestrichelte Projektionslinien mit der Beschriftung „Produktion“ verbinden
  das Sach-System mit der Maschine.
