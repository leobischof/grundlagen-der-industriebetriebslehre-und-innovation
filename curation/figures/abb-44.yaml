curves: []
meaning: >-
  Grundig unterscheidet fünf Planungsgrundfälle der Fabrikplanung, die sich auf Strukturerneuerung
  bzw. Restrukturierung oder auf neue bzw. erweiterte Kapazitäten zurückführen lassen: A Neubau
  (Planung „auf der grünen Wiese“, Greenfield), B Um- und Neugestaltung (Daueraufgabe in
  bestehenden Fabriken, Brownfield), C Erweiterung (mehr Kapazität, Gebäudeausbau, ggf.
  Brownfield), D Rückbau (z. B. wegen Umsatzrückgang oder Reduzierung der Fertigungstiefe) und
  E Revitalisierung (stillgelegte Fabriken werden nach einem Sanierungsprozess neu genutzt).
exam_relevance:
  level: hoch
  reason: >-
    Dreimal gefragt (2024-03-14, 2024-10-15, 2025-06-16: Planungsgrundfälle nennen). Nicht zu
    verwechseln mit dem Planungsvorgehen nach Grundig (Klausur 2026-04-29, Aufgabe 5).
  question_ids: [frage-2024-03-14-3, frage-2024-10-15-3, frage-2025-06-16-4]
drawing:
  difficulty: leicht
  must_know:
    - "Zentraler Begriff „Planungsgrundfälle“"
    - "Fünf Fälle: Neubau, Um- und Neugestaltung, Erweiterung, Rückbau, Revitalisierung"
    - "Je Fall ein Stichwort: Greenfield, Brownfield-Daueraufgabe, Kapazitätserweiterung, Fertigungstiefe/Umsatzrückgang, Nachnutzung stillgelegter Fabriken"
  common_mistakes:
    - "Nur vier Fälle genannt (meist fehlt Rückbau oder Revitalisierung)"
    - "Revitalisierung mit Um- und Neugestaltung verwechselt (Revitalisierung betrifft stillgelegte Fabriken)"
    - "Planungsgrundfälle mit den Phasen des Planungsvorgehens nach Grundig verwechselt"
