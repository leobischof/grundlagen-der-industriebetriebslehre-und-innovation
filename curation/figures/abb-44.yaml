id: abb-44
title: Planungsgrundfälle nach Grundig
type: hierarchie
description: >-
  Sterndiagramm: In der Mitte steht der Kasten „Planungsgrundfälle“, von dem fünf Linien zu fünf
  Kästen führen, die mit A bis E gekennzeichnet sind: A Neubau eines Industriebetriebes, B Um- und
  Neugestaltung bestehender Industriebetriebe, C Erweiterung bestehender Industriebetriebe,
  D Rückbau von Industriebetrieben, E Revitalisierung von Industriebetrieben.
