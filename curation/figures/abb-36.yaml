meaning: >-
  Thom (1980) gliedert den Innovationsprozess in drei klar strukturierte Hauptphasen mit je drei
  Schritten (sec-6.1): Ideengenerierung (Suchfelder bestimmen, Ideen finden, Ideen vorschlagen),
  Ideenakzeptierung (Prüfung, Realisierungspläne erstellen, Entscheidung für einen Plan) und
  Ideenrealisierung (konkrete Verwirklichung, Verkauf an Zielkunden, Akzeptanzkontrolle).
  Berücksichtigt sind der Innovationsimpuls als gemeinsamer Nenner aller Innovationsprozesse sowie
  Umwelteinflüsse (Gesellschaft, Politik, Ökologie/Wirtschaft, Technik), die über die
  Unternehmensplanung auf die Innovation wirken.
