id: abb-36
title: Innovationsprozess von Thom
type: prozess
description: >-
  Prozessbild in einem grauen Feld (Unternehmen): Ein Blockpfeil „Innovationsimpuls“ führt in drei
  hintereinander liegende Pfeilsegmente „Ideengenerierung“, „Ideenakzeptierung“ und
  „Ideenrealisierung“; unter jeder Phase steht ein Kasten mit ihren Teilschritten. Darüber liegt
  der Balken „Unternehmensplanung“, der mit Pfeilen auf alle drei Phasen wirkt und über eine Linie
  links den Innovationsimpuls auslöst. Ganz oben liegt der Balken „Umwelt“, der auf die
  Unternehmensplanung wirkt; vom Ende der Ideenrealisierung führt eine Linie zurück zur Umwelt.
