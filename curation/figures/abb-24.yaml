curves: []
meaning: >-
  Der Produktlebenszyklus umfasst den gesamten Prozess von der Geschäftsidee bis zur Verwendung
  (und Entsorgung) des Produkts. Die Produktentstehung ist der Teil davon, der von der Produkt-
  bzw. Geschäftsidee bis zum Produktionsstart (SOP – Start of Production) reicht; sie gliedert
  sich in strategische Produktplanung, Produktentwicklung und Entwicklung des Produktionssystems,
  die im Skript in den Abschnitten 5.3 bis 5.5 behandelt werden.
