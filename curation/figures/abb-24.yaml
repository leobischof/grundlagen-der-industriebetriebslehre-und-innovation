id: abb-24
title: Produktentstehung als Teil des Produktlebenszyklus
type: prozess
description: >-
  Kreislauf aus zwei Bögen um die Mitte „Produktlebenszyklus“. Der obere, dunkle Bogen
  „Produktgestaltung“ führt von der „Geschäftsidee“ (links) zum „Produktionsstart“ (rechts) und
  enthält die drei Phasen „Strategische Produktplanung“ (Kapitel 5.3), „Produktentwicklung“
  (Kapitel 5.4) und „Entwicklung des Produktionssystems“ (Kapitel 5.5). Der untere, helle Bogen
  führt vom Produktionsstart zurück zur Geschäftsidee über Produktion, Verkauf, Anwendung und
  Recycling.
