meaning: >-
  Industrie Management (Industriebetriebslehre) ist laut Skript (3.3) ein Teil der
  Wirtschaftswissenschaften, genauer der Betriebswirtschaftslehre, und konzentriert sich auf das
  Industrieunternehmen als Untersuchungsgegenstand. Als institutionell abgegrenzte Spezielle
  Betriebswirtschaftslehre steht sie neben Handels- und Bankbetriebslehre und untersucht
  ganzheitlich die Funktionsbereiche eines Industrieunternehmens; die Funktionenlehre schneidet
  dagegen nach Funktionen (Beschaffung, Produktion, Absatz …).
exam_relevance:
  level: mittel
  reason: >-
    In exams/topic-mapping.json ist der Abbildung direkt keine Frage zugeordnet. Abschnitt 3.3
    (by_section) ist aber mit frage-2025-03-18-3 verknüpft (Abgrenzung von Industrieunternehmen
    gegenüber anderen Wirtschaftseinheiten); die Abbildung stützt diese Abgrenzung, daher mittel.
  question_ids: []
drawing:
  difficulty: mittel
  must_know:
    - "Wirtschaftswissenschaften → VWL / BWL"
    - "BWL → Spezielle / Allgemeine BWL"
    - "Spezielle BWL → Institutionenlehre / Funktionenlehre"
    - "Institutionenlehre → Handels-, Industrie-, Bankbetriebslehre; Industriebetriebslehre → Branchen"
    - "Funktionenlehre → sechs Funktionen"
  common_mistakes:
    - "Industriebetriebslehre unter die Funktionenlehre statt unter die Institutionenlehre gehängt"
    - "Allgemeine und Spezielle BWL vertauscht"
