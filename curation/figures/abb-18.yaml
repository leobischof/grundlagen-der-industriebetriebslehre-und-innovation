id: abb-18
title: Abgrenzung des Industrie Management im Kontext der Wirtschaftseinheiten
type: hierarchie
description: >-
  Baumdiagramm der Wirtschaftswissenschaften: Sie teilen sich in Volkswirtschaftslehre und
  Betriebswirtschaftslehre, diese in Spezielle und Allgemeine Betriebswirtschaftslehre. Die
  Spezielle Betriebswirtschaftslehre gliedert sich in Institutionenlehre (Handels-, Industrie-,
  Bankbetriebslehre; die Industriebetriebslehre weiter in Chemie, Maschinenbau, Bauindustrie,
  Textil) und Funktionenlehre (Beschaffung, Absatzwirtschaft, Forschung & Entwicklung,
  Produktionswirtschaft, Controlling, Investitionen/Finanzierung). Der Pfad zur
  Industriebetriebslehre ist grau-fett hervorgehoben.
