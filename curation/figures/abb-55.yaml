id: abb-55
title: Die SDGs der United Nations
type: sonstiges
description: >-
  Raster aus 17 quadratischen Kacheln (fünf Spalten, vier Reihen) mit den 17 Zielen für nachhaltige
  Entwicklung (Sustainable Development Goals) der Vereinten Nationen. Jede Kachel trägt eine große
  Zielnummer, den Zieltitel in Großbuchstaben und im Original ein Piktogramm. Rechts unten neben
  Ziel 17 steht das Logo „ZIELE FÜR NACHHALTIGE ENTWICKLUNG“.
