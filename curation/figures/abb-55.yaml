meaning: >-
  Laut Skript (8.3.1) hat die Generalversammlung der Vereinten Nationen 2015 in der „Agenda 2030“
  konkrete Ziele für Nachhaltigkeit verabschiedet. Sie gliedern sich in 17 Gruppen mit 169
  Einzelzielen und umfassen neben humanitären Zielen (z. B. Armut beenden, Bildung, Frieden) auch
  Ziele, die vor allem für die Industrie relevant sind (z. B. nachhaltige Energie, nachhaltige
  Produktion, Sofortmaßnahmen gegen den Klimawandel). Umweltbewusstes Management erfordert dabei
  bereichsübergreifendes Handeln.
exam_relevance:
  level: niedrig
  reason: >-
    In exams/topic-mapping.json keiner Prüfungsfrage zugeordnet. Die 17 Ziele müssen nicht
    gezeichnet werden; als Hintergrund zu Nachhaltigkeitsfragen (8.3) kann es helfen, einige
    Ziele mit Industriebezug (z. B. 9, 12, 13) nennen zu können.
  question_ids: []
drawing:
  difficulty: leicht
  must_know:
    - "17 Ziele der Agenda 2030 der Vereinten Nationen"
    - "Industrierelevant u. a.: 7 Energie, 8 Arbeit und Wirtschaftswachstum, 9 Industrie/Innovation/Infrastruktur, 12 Konsum und Produktion, 13 Klimaschutz"
  common_mistakes:
    - "SDGs mit den drei Nachhaltigkeitsdimensionen verwechselt"
    - "Anzahl der Ziele falsch angegeben"
reconstruction:
  status: faithful
  svg: figures/reconstructed/abb-55.svg
  notes: >-
    Per Nebeneinander-Vergleich mit dem Original geprüft; alle 17 Kacheln mit Nummer und Titel im
    Originalwortlaut und Original-Zeilenumbruch, Grautöne der Graustufen-Wiedergabe angenähert. Die
    Piktogramme der Kacheln sind nicht nachgebildet, sondern durch einen einfachen weißen Ring als
    Platzhalter ersetzt; das SDG-Logo (farbiges Rad) ist durch einen grauen Ring und seinen Wortlaut
    „ZIELE FÜR NACHHALTIGE ENTWICKLUNG“ ersetzt. Die schmale Schrift des Originals ist durch
    horizontal gestauchtes Arial angenähert.
