id: abb-72
title: Planungsabhängigkeiten
type: flussdiagramm
description: >-
  Gestuftes Planungsschema: Drei Planungsebenen untereinander – „Produkionsprogramm“
  (Änderungszeitraum 1 Jahr), „Mittelfristige Terminplanung“ (1 Monat) und „Kurzfristige
  Terminplanung“ (1 Woche). Links führen Pfeile von oben nach unten durch die Ebenen, beschriftet
  mit Verkaufsplanung, Programmzuweisung und Versand der Bestellung; von der kurzfristigen
  Terminplanung geht es zum Kasten „Materialversorgung / Produktionsplan“ und weiter in den
  dunklen Kasten „Betrieb“, der auf einem Band von „Input“ nach „Output“ liegt. Rechts laufen
  Feedback-Pfeile vom Betrieb zur kurzfristigen, von dort zur mittelfristigen Terminplanung und
  weiter zum Produktionsprogramm; zwischen den oberen Ebenen steht „Grobe Terminplanung“.
