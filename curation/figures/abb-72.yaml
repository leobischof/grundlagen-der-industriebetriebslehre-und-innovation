  notes: >-
    Per Nebeneinander-Vergleich mit dem Original geprüft; Linienführung und Pfeilspitzen an den
    gemessenen Positionen nachgezeichnet, Pfeilspitzen als eigene Dreiecke (keine SVG-Marker).
    Die gepunktete Linie mit kleinem Pfeil bei „Grobe Terminplanung“ ist im Original sehr blass
    und als gestrichelte Linie wiedergegeben. Tippfehler „Produkionsprogramm“ unverändert aus dem
    Original übernommen.
