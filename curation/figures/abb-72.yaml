curves: []
meaning: >-
  Skript 9.1.5.1: Die Terminierung plant die zeitliche Zuordnung der Arbeitsaufgaben; Ergebnis ist
  der auftrags- und einrichtungsspezifische Produktionsplan als „Zielzustand“, von dem der
  tatsächliche Zustand durch Störungen abweicht. Die Abbildung zeigt, wie die Planung vom
  Produktionsprogramm (jährlich änderbar) über die mittelfristige (monatlich) zur kurzfristigen
  Terminplanung (wöchentlich) verfeinert wird und wie Rückmeldungen aus dem Betrieb die
  übergeordneten Ebenen korrigieren. Haupttreiber der Planung: Art, Menge, Termine und Qualität
  der Aufträge, Personal- und Maschinenkapazitäten, geplante Durchlaufzeiten.
exam_relevance:
  level: mittel
  reason: >-
    In exams/topic-mapping.json ist der Abbildung keine Frage zugeordnet. Die Abbildung zeigt aber
    die Planungshierarchie mit Änderungszeiträumen und Rückkopplung, die zum Verständnis von
    Planung und Steuerung (Abbildung 76, Produktionsregelkreis) gebraucht wird; daher mittel.
  question_ids: []
drawing:
  difficulty: schwer
  must_know:
    - "Drei Ebenen mit Änderungszeitraum: Produktionsprogramm 1 Jahr, mittelfristige Terminplanung 1 Monat, kurzfristige Terminplanung 1 Woche"
