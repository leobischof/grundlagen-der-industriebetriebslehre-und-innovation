curves: []
meaning: >-
  Set-based Concurrent Engineering (SBCE) betrachtet Lösungs-Sets über mehrere Phasen und legt
  die endgültige Lösung spät fest (sec-5.6). Zuerst wird das Lösungs-Set der Gestaltungsvarianten
  von Konstruktion und Entwicklung mit dem Lösungs-Set der Produktvarianten der Produktion
  verglichen; die Überlappung begrenzt den für beide Seiten möglichen Lösungsraum. Mit dem
  Projektablauf wird er nach den drei SBCE-Prinzipien (Design-Raum abbilden, Integration durch
  Überschneidung, Machbarkeit vor Ausführung prüfen) weiter eingeschränkt.
