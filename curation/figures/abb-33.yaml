id: abb-33
title: Set-based Concurrent Engineering
type: venn
description: >-
  Ein auf der Spitze stehendes Dreieck (Trichter) zeigt den mit der Zeit schrumpfenden
  Lösungsraum; links verläuft ein dicker grauer Pfeil „Zeit“ nach unten. Oben im Trichter
  überlappen ein hell umrandetes, auf der Spitze stehendes Quadrat (Lösungs-Set
  Gestaltungsvarianten der Konstruktion und Entwicklung) und ein schwarz umrandetes Quadrat
  (Lösungs-Set Produktvarianten der Produktion); die Überlappung ist grau gefüllt. Darunter folgen
  zwei immer kleinere graue Fünfecke gleicher Form – der gemeinsame Lösungsraum wird schrittweise
  bis zur endgültigen Lösung eingeengt.
