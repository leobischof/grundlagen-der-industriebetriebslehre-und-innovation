  - {from: z2, to: z5, kind: konkurriert, text: "hohler Doppelpfeil (unten); die Pfeile verbinden die beiden Zielgruppen als Ganzes"}
curves: []
meaning: >-
  Laut Skript (9.2.2) steht der Forderung nach Minimierung der Durchlaufzeit die Forderung
  gegenüber, die Fertigungsaufträge zeitlich so zu verteilen, dass eine möglichst hohe Auslastung
  der Betriebsmittel erreicht wird. Je stärker arbeitsablaufbedingte Leerzeiten minimiert werden,
  desto besser wird die Kapazitätsauslastung erfüllt. Jede Ablaufplanung versucht, diese beiden
  entgegengesetzten Forderungen in Einklang zu bringen. Dieses von Gutenberg geprägte „Dilemma der
  Ablaufplanung“ erfordert eine temporäre, unterschiedliche Gewichtung der Ziele.
