id: abb-79
title: Dilemma der Ablaufplanung
type: sonstiges
description: >-
  Zwei Kästen stehen einander gegenüber, verbunden durch zwei hohle Doppelpfeile; dazwischen steht
  fett „Dilemma der Ablaufplanung“. Links die kapazitätsorientierten Ziele „Maximierung der
  durchschnittlichen Kapazitätsauslastung“ und „Minimierung der Leer-Kosten“, rechts die
  flussorientierten Ziele „Minimierung der mittleren Durchlaufzeit“, „Minimierung der Bestände
  (WIP)“ und „Maximierung der Termintreue“.
