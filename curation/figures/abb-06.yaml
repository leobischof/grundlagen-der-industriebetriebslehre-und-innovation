id: abb-06
title: Die innovativsten Unternehmen 2022
type: tabelle
description: >-
  Tabelle mit vier Spalten (Rang 2021, Unternehmen, Land, Sektor) und zehn Zeilen: die zehn
  innovativsten Unternehmen laut BCG-Rangliste. Sieben der zehn Unternehmen stammen aus den USA,
  dazu je eines aus Südkorea, China und Japan. Kopfzeile dunkelgrau, Zeilen abwechselnd hell
  hinterlegt.
