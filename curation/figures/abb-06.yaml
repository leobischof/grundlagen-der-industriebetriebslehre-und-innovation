meaning: >-
  Studien wie der „Annual Innovation Report“ der BCG bewerten regelmäßig die innovativsten
  Unternehmen weltweit. Im Mittel sitzen 7 der 10 innovativsten Unternehmen in den USA, was die
  Dominanz westlicher Unternehmen bei der Innovationsfähigkeit zeigt. Die BCG-Rangliste beruht auf
  einer Umfrage unter über 1.500 Innovations-Führungskräften und vier Dimensionen: Global
  Mindshare, Industry Peer View, Industry Disruption und Wertschöpfung (Skript 2.1, S. 22–24).
