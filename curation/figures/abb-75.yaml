meaning: >-
  Skript 9.1.8: ERP-Systeme verwalten Nachfrage, Kapazität und die dafür nötigen Informationen
  unter Berücksichtigung von Einschränkungen wie tatsächlicher Kapazität oder Lieferterminen. ERP
  ist ein unternehmensweites Informationssystem mit Informationen aus allen für Planung und
  Steuerung relevanten Funktionen; wichtigster Vorteil ist die Transparenz durch die gemeinsame
  ERP-Datenbank. ERP-Systeme sind eine Weiterentwicklung der MRP-Systeme (seit den 1970er Jahren);
  Anbieter sind z. B. SAP und Oracle.
