  must_know:
    - "Integrierte Datenbank im Zentrum, alle Funktionsbereiche tauschen über sie Daten aus"
    - "Acht Module: Strategische Berichterstattung, Finanzen, Verkauf und Marketing, Betrieb, Lieferung und Logistik, Einkauf und Lieferung, Personalabteilung, Service"
    - "Lieferanten links, Kunden rechts, Geschäftsführung und Stakeholder oben, Mitarbeiter unten"
  common_mistakes:
