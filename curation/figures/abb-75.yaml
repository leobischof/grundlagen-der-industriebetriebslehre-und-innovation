id: abb-75
title: Enterprise resource planning
type: system
description: >-
  Sterndiagramm eines ERP-Systems: In der Mitte der dunkle Kasten „Integrierte Datenbank“, um ihn
  herum acht graue Funktionsmodule (Strategische Berichterstattung, Finanzen, Verkauf und
  Marketing, Betrieb, Lieferung und Logistik, Einkauf und Lieferung, Personalabteilung, Service),
  jeweils mit Doppelpfeil zur Datenbank. Außen stehen die Partner: links „Lieferanten“ (Doppelpfeile
  zu Betrieb sowie Einkauf und Lieferung), rechts „Kunden“ (Doppelpfeile zu Verkauf und Marketing,
  Lieferung und Logistik sowie Service), oben „Geschäftsführung und Stakeholder“, unten
  „Mitarbeiter“.
