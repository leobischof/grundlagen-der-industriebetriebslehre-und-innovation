    - "Lieferanten mit Verkauf/Service statt mit Betrieb und Einkauf verbunden"
reconstruction:
  status: faithful
  svg: figures/reconstructed/abb-75.svg
  notes: >-
    Per Nebeneinander-Vergleich mit dem Original geprüft; Kastenpositionen und alle 13
    Doppelpfeile übernommen, Pfeilspitzen als eigene Dreiecke (keine SVG-Marker). Die im Original
    blass gepunkteten Verbindungslinien sind als hellgraue gestrichelte Linien wiedergegeben. Die
    weiße Schrift auf hellgrauen Modulen ist im Scan schwer lesbar; Wortlaut (u. a.
    „Strategische Bericht-erstattung“) am vergrößerten Ausschnitt geprüft.
