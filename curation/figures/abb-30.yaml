    Simultaneous Engineering (Parallelisierung, Integration, Standardisierung); die Abbildung ist
    die Standardskizze zur Parallelisierung.
  question_ids: [frage-2025-04-09-5]
drawing:
  difficulty: mittel
  must_know:
    - "Oben sequentiell: Produktplanung, danach Produktionsplanung"
    - "Unten parallel: überlappende Teilschritte mit Informationsfluss in beide Richtungen"
    - "Zeitgewinn als „Reduktion Time-to-Market“ bemaßen"
  common_mistakes:
