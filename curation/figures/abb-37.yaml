meaning: >-
  Der Stage-Gate-Prozess nach Robert G. Cooper gliedert die Produktinnovation in eine Abfolge von
  Stages (Arbeitsphasen) und Gates (Entscheidungspunkten). Er ist funktionsübergreifend, legt den
  Schwerpunkt auf die frühen Phasen und erlaubt paralleles Arbeiten. Vor jeder Stage steht ein
  Gate als Meilenstein mit GO/KILL-Entscheidung und Qualitätskontrolle. Typisch sind vier bis
  sechs Stages, wobei spätere Stages teurer werden: Ideengenerierung (Entdeckung), Scoping,
  Business Case erstellen, Entwicklung, Prüfen und Validieren, Markteinführung (Launch), danach
  ein Post-Launch-Rückblick.
