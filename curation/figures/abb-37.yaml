id: abb-37
title: Stage-Gate-Prozess nach Cooper
type: prozess
description: >-
  Prozesskette von links nach rechts unter einem großen Pfeil „Neue Produkte auf den Markt
  bringen“. Auf die Entdeckung folgen abwechselnd Gates (Rauten, Gate 1–5) und Stages (dunkle
  Quadrate, Stage 1–5). Über den Gates steht die jeweilige Entscheidung (Ideen Screening, Zweites
  Screening, Zur Entwicklung, Zum Testen, Zum Launch), unter den Stages die Tätigkeit (Scoping,
  Business Case erstellen, Entwicklung, Prüfung & Validierung, Launch). Nach dem Launch folgt der
  Post-Launch Rückblick (Kasten mit €-Zeichen).
