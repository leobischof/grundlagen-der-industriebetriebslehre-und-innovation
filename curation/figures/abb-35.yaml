curves: []
meaning: >-
  Die Produktentstehung umfasst laut Skript die drei Hauptaufgabenbereiche strategische
  Produktplanung, Produktentwicklung und Produktionssystementwicklung. Sie sind nicht als
  aufeinanderfolgende Phasen, sondern als Gesamtbild zu verstehen, dessen Bereiche sich
  überschneiden. Die Überschneidungen sind Integrationsbereiche: Strategische Produktentwicklung
  (Planung und Entwicklung; Businessplan auf Basis von Geschäftserfolgspotenzialen), Strategische
  Produktionssystementwicklung (Planung und Produktionssystem; technische Kernkompetenzen in der
  Produktion), Integrierte Produkt- und Produktionssystementwicklung (strukturintegrierte Lösungen,
  übergreifende Teams) und im Zentrum Systems Engineering als Kooperationskern aller drei Bereiche
  (nach Gausemeier et al., kooperatives Produktengineering).
exam_relevance:
  level: hoch
  reason: >-
    Ausdrücklich als Skizzieraufgabe gefragt (2025-03-18: Integrationsbereiche skizzieren und
    benennen, Venn-Diagramm).
  question_ids: [frage-2025-03-18-2]
drawing:
  difficulty: mittel
  must_know:
    - "Drei überlappende Kreise: Strategische Produktplanung (oben), Produktentwicklung (unten links), Produktionssystementwicklung (unten rechts)"
    - "Integrationsbereich Planung ∩ Produktentwicklung: Strategische Produktentwicklung"
    - "Integrationsbereich Planung ∩ Produktionssystem: Strategische Produktionssystementwicklung"
    - "Integrationsbereich Produkt ∩ Produktionssystem: Integrierte Produkt- und Produktionssystementwicklung"
    - "Mitte (alle drei): Kooperationskern „Systems Engineering“"
  common_mistakes:
    - "Integrationsbereiche den falschen Schnittflächen zugeordnet (z. B. „Strategische Produktentwicklung“ zwischen Produktentwicklung und Produktionssystem)"
    - "Systems Engineering vergessen oder als vierten Kreis gezeichnet"
    - "Bereiche als Phasen nacheinander statt als Überschneidungen gezeichnet"
    - "Den Tippfehler „Produktenwicklung“ aus dem Original abschreiben"
