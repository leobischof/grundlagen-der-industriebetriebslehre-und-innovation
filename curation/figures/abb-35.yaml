id: abb-35
title: Integrationsbereiche der Themen Innovationsprozess & Produktentwicklung
type: venn
description: >-
  Venn-Diagramm aus drei sich überlappenden Kreisen innerhalb eines umschließenden Kreises: oben
  Strategische Produktplanung, unten links Produktentwicklung, unten rechts
  Produktionssystementwicklung. Hinweislinien führen von den vier Überschneidungsflächen zu den
  Integrationsbereichen: Strategische Produktentwicklung, Strategische
  Produktionssystementwicklung, Integrierte Produkt- und Produktionssystementwicklung sowie der
  Kooperationskern „Systems Engineering“ in der Mitte.
