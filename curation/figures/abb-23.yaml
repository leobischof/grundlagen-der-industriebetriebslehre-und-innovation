meaning: >-
  Die Abbildung zeigt den Wandel der Produktentstehung (Skript S. 75, Kapitel 5 Überblick): Bis
  zum Ende des 19. Jahrhunderts bündelte der Handwerks-Meister das gesamte Wissen. Mit der
  Industrialisierung wurden Planung und Ausführung getrennt und die Arbeit in viele Fachgebiete
  differenziert. Heute werden diese Fachgebiete wieder integriert, z. B. in Simultaneous
  Engineering Teams oder Qualitätsmanagement Teams, weil eine nicht integrierte Produktentstehung
  den heutigen Anforderungen nicht gerecht wird.
