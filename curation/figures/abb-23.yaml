id: abb-23
title: Geschichte der Produktentstehung
type: prozess
description: >-
  Dreispaltige Entwicklungsdarstellung von links nach rechts. Spalte „Bis 1900“: ein einzelner
  Kasten „Handwerks-Meister“. Spalte „1900-1980“: eine Säule von Fachfunktionen (Marketing,
  Vertrieb, Finanzwesen, Konstruktion, Entwicklung, Erprobung, Produktionsvorbereitung, Produktion,
  Qualitätsmanagement, Prod.-Entwicklung, Materialmanagement, Versand, Service), zu denen Linien
  vom Handwerks-Meister ausfächern. Spalte „heute“: Linien aus den Fachfunktionen laufen im
  „Simultaneous Engineering Team“ und im „Qualitätsmanagement Team“ zusammen. Unter den Spalten
  zeigen Pfeile die Entwicklungsrichtung „Differenzierung“ und „Integration“.
