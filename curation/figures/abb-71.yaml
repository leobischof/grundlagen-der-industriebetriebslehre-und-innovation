meaning: >-
  Skript 9.1.5: Die Zeit- und Kapazitätsplanung legt Start- und Endtermine für die Ausführung der
  Arbeitsaufträge fest und berücksichtigt dabei die begrenzte verfügbare Kapazität. Ziel ist, die
  Gesamtaufgabe (Erfüllung der Kundennachfrage) im vorgegebenen Zeitraum zu ermöglichen. Sie baut
  auf den Ergebnissen von Produktionsprogramm und Materialbedarfsplanung auf.
