id: abb-45
title: Typologisierung von Produktionssystemen
type: hierarchie
description: >-
  Baumdiagramm: Der Wurzelkasten „Produktionssysteme“ verzweigt in zwei Typologien. Links die
  „Produktionsart“ mit dem Kriterium „nach mengenmäßigen Auftragsumfang und die
  Wiederholhäufigkeit“ und den Ausprägungen Einmalproduktion, Einzel- und Kleinserienfertigung,
  Serienfertigung, Massenfertigung. Rechts die „Fertigungsform“ mit dem Kriterium „nach räumlicher
  Anordnung“ und den Ausprägungen Punkt-, Werkstatt-, Gruppen-, Reihen- und Fließfertigung.
