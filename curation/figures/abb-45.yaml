    Typologien der Produktionsprozesse (2024-12-10), Fertigungsarten aufzählen und erklären
    (2025-04-09). Die Abbildung ist das Gerüst für alle drei Fragen.
  question_ids: [frage-2024-03-14-2, frage-2024-12-10-4, frage-2025-04-09-4]
