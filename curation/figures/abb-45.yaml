meaning: >-
  Produktionssysteme werden im Skript (8.2.1) nach zwei Merkmalen typologisiert. Die
  Produktionsart richtet sich nach dem mengenmäßigen Auftragsumfang und der Wiederholhäufigkeit
  (Einmal-, Einzel- und Kleinserien-, Serien-, Massenproduktion; Spezialfall: kontinuierliche
  Produktion der Prozessindustrie). Die Fertigungsform beschreibt die räumliche Anordnung der
  Betriebsmittel (Punkt-, Werkstatt-, Gruppen-, Reihen-, Fließfertigung). Laut Skript wird die
  Fertigungsform maßgeblich von der Produktionsart vorgegeben (siehe Abbildung 50).
exam_relevance:
  level: hoch
  reason: >-
