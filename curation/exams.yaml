# Prüfungsfragen-Datenbank (Single Source of Truth für Prüfungsfragen).
#
# Handkuratiert aus zwei Quellen (Originale liegen nur lokal, sind git-ignoriert):
#   * fragensammlung-uware   sources/original-pdfs/fragensammlung-uware-2026ws.pdf
#                            Studierenden-Gedächtnisprotokolle von 11 Prüfungsterminen
#                            (trust: student-recollection). KEINE Punkte, teils nur Stichworte.
#   * klausur-2026-04-29     sources/original-pdfs/klausur-2026-04-29.pdf
#                            Abschrift der Angabe vom 29.04.2026 durch Studierende
#                            (trust: student-transcript), mit Punkten (Summe 33 P).
# Keine Quelle ist amtlich; die Fragen sind unverifiziert.
#
# Die Formulierungen (wording) sind wörtlich aus der Textebene der PDFs übernommen,
# inklusive Tipp- und Schreibfehlern der Protokolle ("bennen", "Brundlandt",
# "unternemerischen", "tertiät"). Zeilenumbrüche des PDFs sind zu einem Leerzeichen
# zusammengezogen. Unleserliches wäre mit [unleserlich] markiert (kam nicht vor).
#
# Felder je Frage
#   id            frage-<YYYY-MM-DD>-<n>, n = laufende Nummer innerhalb des Termins
#   exam_date     Datum des Prüfungstermins (ISO)
#   source        Id der Quelle (sources/manifest.yaml)
#   trust         student-recollection | student-transcript
#   wording       exakter Wortlaut
#   points        Punkte laut Angabe, null wenn unbekannt (nie geschätzt)
#   task_type     Haupt-Aufgabentyp = das erste Operatorverb der Frage:
#                 definition | erklaerung | aufzaehlung | zeichnung | vergleich | berechnung | anwendung
#   competencies  wissen | verstehen | anwenden | zeichnen | vergleichen | berechnen
#                 (alle, die die Frage verlangt; "zeichnen" auch bei "Skizze"/"Diagramm")
#   topics        Themen-Ids aus curation/topics.yaml
#   sections      TOC-Nummern aus curation/structure.yaml (die spezifischsten, die die Antwort tragen)
#   figures       Abbildungs-/Formel-Ids aus curation/figures.yaml, die zur Antwort gehören
#   script_coverage  voll | teilweise  (Abgleich mit Skript v2.0, WS 2024/25; Begründung in notes)
#   notes         Unsicherheiten der Zuordnung bzw. Abweichungen zum Skript
#
# Die Zuordnung zu Themen, Abschnitten und Abbildungen ist eine fachliche Einschätzung
# und bewusst konservativ gehalten: nur was die Antwort sicher trägt.
# Stichwort-Fragen ohne Aufgabenverb (z. B. "Gozintograph") sind nach dem
# wahrscheinlichsten Aufgabentyp eingestuft; das steht dann in notes.

