# Canonical table of contents of the script (Skriptversion 2.0, WS 2024/25).
#
# Curated by hand from the chapter title pages (PDF p. 10, 30, 56, 68, 84, 106,
# 116, 123, 156) and the numbered headings found in the OCR layer; every entry
# was checked against the page image. `pdf_page` is the page holding the
# heading; the heading line itself is located by fuzzy-matching `title`
# (outside the running-header band). An entry ends where the next one starts.
#
# Printed page = pdf_page - 10 (from PDF page 11 on).
#
# kind: chapter | section (default) | literature | frontmatter
# number_printed: only where the script prints a different (wrong) number.
# One markdown file is generated per level-2 section (X.Y); deeper entries
# become headings inside that file.

