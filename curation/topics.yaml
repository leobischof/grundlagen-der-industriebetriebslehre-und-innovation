# Prüfungsrelevante Themen des gesamten Skripts (Single Source of Truth für Themen).
#
# Handkuratiert. Jedes Thema bündelt Skript-Abschnitte (TOC-Nummern aus
# curation/structure.yaml) und Abbildungen/Tabellen/Formeln (Ids aus
# curation/figures.yaml). Die Liste deckt das ganze Skript ab – auch Themen, die in
# den bekannten Prüfungen noch nie gefragt wurden (Häufigkeit 0 in
# exams/frequency-analysis.md).
#
# Regeln
#   * id          kebab-case, deutsch, stabil (wird in exams.yaml und in den
#                 Verknüpfungsdateien referenziert – nicht umbenennen).
#   * sections    die spezifischsten TOC-Nummern, die das Thema inhaltlich tragen.
#   * figures     Abbildungen, die man zur Antwort braucht bzw. zeichnen können sollte.
#   * keywords    Suchbegriffe (auch Schreibweisen aus den Prüfungsprotokollen).
#   * Jeder Abschnitt (X.Y) des Skripts soll in mindestens einem Thema vorkommen
#     (wird von pipeline/link_topics.py geprüft und gemeldet).

