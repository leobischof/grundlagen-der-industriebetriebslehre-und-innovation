# kind: figure (Abbildung) | table (Tabelle) | formula (Formelkasten)
# id:   abb-NN (Abbildung NN) · tab-NN (Tabelle NN) · formel-* · abb-u<Seite> (unbeschriftet)
# Ausführliche Metadaten je Abbildung (Achsen, Elemente, Beziehungen, Prüfungsrelevanz …)
# stehen in curation/figures/<id>.yaml; diese Datei verortet die Abbildung nur.

