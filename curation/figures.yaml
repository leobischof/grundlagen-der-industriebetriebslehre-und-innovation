# Kanonische Liste aller Abbildungen, Tabellen und Formelkästen des Skripts (Single Source of Truth).
#
# Entstehung: `python -m pipeline detect-figures` schlägt Bildregionen vor
# (pipeline/layout.py, deterministisch). Jeder Vorschlag wurde auf Kontaktbögen
# geprüft; die Beschriftungen wurden aus kontrastverstärkten Beschriftungsstreifen
# gelesen (ein Vision-Durchgang über 4 Streifenbögen, protokolliert in
# curation/ai-log.jsonl) und werden bei jedem Lauf per Tesseract gegengeprüft
# (`python -m pipeline captions`).
#
# bbox: [x0, y0, x1, y1] in PDF-Punkten, *visuelle* Seitenkoordinaten (Seite
